<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#131b1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raíces">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<script src="bundle.js"></script>
<title>Raíces del Valle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Wood-and-cream palette taken from the Ninja Adventure UI kit */
  --ink:#131b1b; --ink2:#262c2b; --wood:#9b513c; --wood-d:#6b3a2e; --orange:#f06733; --orange-d:#b8452a; --orange-l:#f9a16b;
  --cream:#f6eddf; --cream2:#eadcc5; --cream3:#d6c1a1; --paper:#fffaf2; --tdark:#3a2621; --tmute:#86675a;
  --teal:#5f8f8b; --leaf:#6fae3f; --danger:#d9443a; --violet:#8b5fd0; --gold:#f2b632;
  --f-pix:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;background:var(--ink);color:var(--tdark);overscroll-behavior:none}
body{margin:0;overflow:hidden;font-family:var(--f-body);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.px,.ico{image-rendering:pixelated}

/* Icons come from one 10x7 sheet of 16px cells */
.ico{display:inline-block;flex:none;width:24px;height:24px;background:url(icons.png) no-repeat;background-size:240px 168px;vertical-align:middle}
.ico.s{width:16px;height:16px;background-size:160px 112px}
.ico.l{width:32px;height:32px;background-size:320px 224px}
.ico.xl{width:64px;height:64px;background-size:640px 448px}

/* Panels: cream fill, orange rim, ink outline */
.pnl{background:var(--cream);color:var(--tdark);border-radius:6px;box-shadow:0 0 0 3px var(--orange),0 0 0 6px var(--ink),0 9px 0 4px rgba(0,0,0,.28)}

#hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.pill{pointer-events:auto;background:var(--cream);color:var(--tdark);border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 var(--cream3);padding:3px 8px 5px;font-family:var(--f-pix);font-weight:600;font-size:15px;display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums;min-height:28px;box-sizing:border-box}
.pill.grow{flex:1;min-width:0}
.ibtn{cursor:pointer;padding:2px 6px 4px;border:0}
.ibtn:active{transform:translateY(2px)}
.bar{position:relative;height:10px;flex:1;min-width:30px;background:#3b2d2a;border-radius:3px;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--leaf);display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3)}
.bolt{width:9px;height:13px;flex:none;background:var(--orange);clip-path:polygon(60% 0,0 58%,45% 58%,30% 100%,100% 38%,55% 38%)}
.ess{width:10px;height:10px;background:#b28cff;transform:rotate(45deg);box-shadow:inset -2px -2px 0 #6c4fb0;flex:none;display:inline-block}
#obj{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:5;text-align:left;background:var(--cream);color:var(--tdark);border:0;border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 var(--cream3);padding:5px 10px 7px;font-size:13.5px;line-height:1.3;cursor:pointer;display:flex;gap:8px;align-items:center}
#obj b{font-family:var(--f-pix);font-weight:700;color:var(--wood);white-space:nowrap;font-size:15px}
#obj span{min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#obj.ready{box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--gold),inset 0 -3px 0 var(--cream3);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 0 6px #ffe39a,inset 0 -3px 0 var(--cream3)}}

#ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:flex-end;gap:12px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none}
#hotbar{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;touch-action:pan-x;padding:4px 3px 6px}
#hotbar::-webkit-scrollbar{display:none}
.seed{flex:none;display:flex;align-items:center;gap:5px;background:var(--cream);color:var(--tdark);border:0;border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 var(--cream3);padding:3px 9px 5px 5px;font-family:var(--f-pix);font-weight:600;font-size:14px;cursor:pointer;line-height:1.05;text-align:left}
.seed.on{background:#ffe9a8;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--orange),inset 0 -3px 0 #e8c46a}
.seed small{display:block;color:var(--tmute);font-family:var(--f-body);font-weight:400;font-size:11px}
#act{pointer-events:auto;flex:none;width:84px;height:84px;border-radius:50%;border:0;background:var(--orange);box-shadow:inset 0 -6px 0 var(--orange-d),inset 0 4px 0 var(--orange-l),0 0 0 3px var(--ink),0 6px 0 3px rgba(0,0,0,.3);font-family:var(--f-pix);font-weight:700;font-size:14px;color:#fff6ea;text-shadow:0 2px 0 #7a2a16;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;padding:4px;gap:1px;touch-action:none;cursor:pointer}
#act small{font-weight:500;font-size:10.5px;opacity:.95;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#act .ico{filter:drop-shadow(0 2px 0 rgba(90,30,10,.6))}
#act.idle{background:var(--cream2);color:var(--tmute);text-shadow:none;box-shadow:inset 0 -6px 0 var(--cream3),0 0 0 3px var(--ink),0 6px 0 3px rgba(0,0,0,.3)}
#act.idle .ico{opacity:.35;filter:grayscale(1)}
#act.down{transform:translateY(4px);box-shadow:inset 0 -2px 0 var(--orange-d),0 0 0 3px var(--ink),0 2px 0 3px rgba(0,0,0,.3)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:calc(100% - env(safe-area-inset-top,0px) - 60px);overflow-y:auto;background:var(--cream);color:var(--tdark);border-radius:12px 12px 0 0;box-shadow:0 -4px 0 var(--orange),0 -7px 0 var(--ink);padding:0 14px calc(env(safe-area-inset-bottom,0px) + 22px);touch-action:pan-y;-webkit-overflow-scrolling:touch}
#sheet header{position:sticky;top:0;z-index:2;background:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px;border-bottom:2px dashed var(--cream3);margin-bottom:4px}
h2{font-family:var(--f-pix);font-weight:700;font-size:25px;color:var(--wood);margin:0;text-wrap:balance;line-height:1.05}
h3{font-family:var(--f-pix);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--tmute);margin:18px 0 8px}
p{margin:0}
.sub{color:var(--tmute);font-size:13.5px;line-height:1.45}
.list{display:flex;flex-direction:column;gap:9px}
.card{background:var(--paper);border-radius:6px;box-shadow:0 0 0 2px var(--cream3),0 3px 0 2px var(--cream3);padding:10px;display:flex;gap:10px;align-items:center}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .name{font-family:var(--f-pix);font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--f-pix);font-weight:600;font-size:15px;background:var(--orange);color:#fff7ea;border:0;border-radius:5px;box-shadow:inset 0 -4px 0 var(--orange-d),inset 0 2px 0 var(--orange-l),0 0 0 2px var(--ink);padding:6px 12px 9px;cursor:pointer;white-space:nowrap;text-shadow:0 1px 0 #8a2f1c;line-height:1.1}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--orange-d),0 0 0 2px var(--ink)}
.btn.alt{background:var(--cream2);color:var(--tdark);text-shadow:none;box-shadow:inset 0 -4px 0 var(--cream3),inset 0 2px 0 #fff6e6,0 0 0 2px var(--ink)}
.btn.warn{background:#c9493c;box-shadow:inset 0 -4px 0 #8f2c24,inset 0 2px 0 #e37a6c,0 0 0 2px var(--ink)}
.btn.sm{font-size:13.5px;padding:4px 9px 7px}
.btn:disabled{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.x{background:var(--cream2);border:0;border-radius:5px;box-shadow:inset 0 -3px 0 var(--cream3),0 0 0 2px var(--ink);width:38px;height:38px;font-family:var(--f-pix);font-weight:700;font-size:20px;color:var(--tdark);cursor:pointer;flex:none}
.tag{display:inline-block;font-family:var(--f-pix);font-weight:500;font-size:12px;padding:0 7px 1px;border-radius:4px;background:var(--cream2);color:var(--tmute);box-shadow:0 0 0 1px var(--cream3)}
.tag.gold{background:#ffe9a8;color:#7a4c0c;box-shadow:0 0 0 1px #e0b44e}
.cost{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cost span{font-size:12px;padding:1px 7px 1px 3px;border-radius:4px;background:var(--cream2);display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;color:var(--tdark)}
.cost span.no{background:#f7d2c9;color:#9b2c1f}
.hearts{display:flex;gap:2px;margin-top:2px}
.hearts i{width:12px;height:10px;background:#d8c6b0;clip-path:polygon(0 20%,20% 0,40% 0,50% 15%,60% 0,80% 0,100% 20%,100% 50%,50% 100%,0 50%)}
.hearts i.on{background:#e8405a}
.hearts.rival i.on{background:var(--orange)}
.hearts.mentor i.on{background:var(--gold)}
.portrait{width:57px;height:57px;flex:none;border-radius:4px;background:#121a17;box-shadow:0 0 0 2px var(--teal),0 0 0 4px var(--ink);image-rendering:pixelated;margin:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.item{background:var(--paper);border-radius:6px;box-shadow:0 0 0 2px var(--cream3);padding:6px 8px;display:flex;gap:7px;align-items:center;min-width:0}
.item .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.2}
.item .ct{font-family:var(--f-pix);font-weight:700;font-variant-numeric:tabular-nums;color:var(--wood)}
.item.tap{cursor:pointer;color:var(--tdark);font:inherit;border:0;width:100%}
.aff{font-size:12.5px;color:var(--violet)}
.rar0{color:var(--tdark)}.rar1{color:#2f7fd1}.rar2{color:#8b4fd8}.rar3{color:#d27a00}

#dlg{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;background:var(--cream);color:var(--tdark);border-radius:6px;box-shadow:0 0 0 3px var(--orange-l),0 0 0 6px var(--ink),0 10px 0 5px rgba(0,0,0,.3);padding:14px;display:flex;gap:14px;cursor:pointer;max-width:620px;margin:0 auto}
#dpor{width:76px;height:76px;flex:none;background:#121a17;border-radius:4px;box-shadow:0 0 0 3px var(--teal),0 0 0 5px var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:3px}
#dpor img{width:76px;height:76px;image-rendering:pixelated;display:block}
#dlg .dbody{flex:1;min-width:0}
#dname{position:absolute;left:12px;top:-30px;background:var(--wood);color:#fff1de;font:600 16px var(--f-pix);padding:3px 12px 5px;border-radius:5px 5px 0 0;box-shadow:0 0 0 3px var(--ink);text-shadow:0 1px 0 #4a2318}
#dname:empty{display:none}
#dtext{font:500 17px/1.42 var(--f-pix);min-height:3em;max-width:62ch}
#dtext.narr{font-family:var(--f-body);font-style:italic;font-size:16px;color:#5a4038}
#dnext{position:absolute;right:14px;bottom:10px;width:10px;height:8px;background:var(--orange);clip-path:polygon(0 0,100% 0,50% 100%);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dchoices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#dchoices .btn{text-align:left;white-space:normal}

.ov{position:absolute;inset:0;z-index:30;background:rgba(15,20,22,.66);display:flex;align-items:center;justify-content:center;padding:18px;touch-action:pan-y}
.ovbox{width:min(440px,100%);max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px;box-sizing:border-box}
.perks{display:flex;flex-direction:column;gap:9px}
.perk{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--paper);color:var(--tdark);border:0;border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 0 -4px 0 var(--cream3);padding:9px 12px 11px;cursor:pointer}
.perk:active{transform:translateY(2px)}
.perk b{font-family:var(--f-pix);font-size:18px;color:var(--orange-d);font-weight:700}
.perk span{font-size:14px}
.perk i{font-style:normal;font-size:12px;color:var(--tmute)}
.loot{display:flex;flex-wrap:wrap;gap:6px}
.loot span{display:inline-flex;gap:4px;align-items:center;background:var(--paper);box-shadow:0 0 0 2px var(--cream3);padding:2px 8px 2px 3px;border-radius:5px;font-size:13px}
textarea{width:100%;min-height:90px;background:var(--paper);color:var(--tdark);border:0;box-shadow:0 0 0 2px var(--ink);border-radius:5px;padding:8px;font:12px ui-monospace,monospace;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.chapters{display:flex;flex-direction:column;gap:4px}
.chapters div{display:flex;gap:8px;font-size:14px;align-items:baseline}
.chapters div b{font-family:var(--f-pix);width:18px;flex:none;color:var(--tmute)}
.chapters .done{color:var(--tmute);text-decoration:line-through}
.chapters .cur{color:var(--orange-d);font-weight:700}

#title{z-index:40;background:linear-gradient(180deg,rgba(19,27,27,0) 30%,rgba(19,27,27,.82) 70%);align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
.tbox{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.tname{font-family:var(--f-pix);font-weight:700;font-size:clamp(46px,14vw,66px);line-height:.92;color:#ffe2b0;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 7px 0 var(--orange-d),0 10px 0 var(--ink);margin:0 0 6px;letter-spacing:.01em}
.ttag{color:#fff4e2;font-size:15px;line-height:1.45;max-width:36ch;text-shadow:0 1px 0 #000}
.tbox input{font:600 17px var(--f-pix);background:var(--paper);color:var(--tdark);border:0;border-radius:5px;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 var(--cream3);padding:10px 12px;-webkit-user-select:text;user-select:text}
.tbox label{font-family:var(--f-pix);font-weight:600;font-size:14px;color:#ffe2b0;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 var(--ink)}
.tbox .btn{font-size:19px;padding:10px 14px 13px}
.tcred{font-size:11.5px;color:#cdbfae;text-shadow:0 1px 0 #000}

#runhud{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#runhud .row{flex-wrap:nowrap}
#runhud .pill{pointer-events:auto}
#rHp .bar{height:12px}
#rHp .bar i{background:#e8405a}
#rBoss{display:flex;gap:8px;align-items:center;background:rgba(19,27,27,.72);border-radius:6px;padding:5px 8px 6px 5px;box-shadow:0 0 0 2px var(--ink)}
#rBoss img{width:38px;height:38px;image-rendering:pixelated;border-radius:3px;background:#2a1f2c;box-shadow:0 0 0 2px #7d5aa8;flex:none}
#rBoss .bx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#rBoss .bar{flex:none;height:10px}
#rBoss .bar i{background:#b07cf0}
#rBossName{font-family:var(--f-pix);font-weight:600;font-size:14px;color:#f1e6ff;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#retire{pointer-events:auto;align-self:center}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);z-index:50;background:var(--cream);color:var(--tdark);border-radius:6px;box-shadow:0 0 0 2px var(--orange),0 0 0 4px var(--ink);padding:7px 12px 8px;font-family:var(--f-pix);font-weight:600;font-size:15px;max-width:min(88vw,420px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#fade{position:absolute;inset:0;background:#0b0f10;opacity:0;pointer-events:none;z-index:60;transition:opacity .35s}
#fade.on{opacity:1}
#load{position:absolute;inset:0;z-index:70;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#ffe2b0;font-family:var(--f-pix);font-size:18px}
#load .bar{width:min(260px,70vw);flex:none;height:14px}
#load .bar i{background:var(--orange)}
@media (prefers-reduced-motion:reduce){#obj.ready,#dnext{animation:none}#fade,#toast{transition:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Juego"></canvas>
  <div id="safe"></div>

  <div id="hud" hidden>
    <div class="pill" id="hDay"></div>
    <div class="pill"><i class="ico" data-ic="coin" style="margin:-3px -2px -3px -4px"></i><span id="hGold"></span></div>
    <div class="pill grow"><i class="bolt"></i><div class="bar"><i id="hEn"></i></div><span id="hEnT"></span></div>
    <button class="pill ibtn" data-a="mochila" aria-label="Mochila"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#3a2621" stroke-width="2.4" stroke-linejoin="round"><path d="M8 7V5a4 4 0 0 1 8 0v2"/><rect x="4" y="7" width="16" height="14" rx="3" fill="#f38c4c"/><path d="M9 13h6"/></svg></button>
  </div>
  <button id="obj" data-a="journal" hidden></button>

  <div id="ctrl" hidden><div id="hotbar"></div><button id="act" class="idle" aria-label="Acción"><i class="ico l" id="actI"></i><span id="actL">·</span><small id="actS"></small></button></div>

  <section id="sheet" hidden></section>

  <div id="runhud" hidden>
    <div class="row">
      <div class="pill grow" id="rHp"><i class="ico s" data-ic="heart"></i><div class="bar"><i id="rHpB"></i></div><span id="rHpT"></span></div>
      <div class="pill" id="rLbl"></div>
      <button class="pill ibtn" data-a="pause" aria-label="Pausa" style="font-size:16px;padding:2px 10px 4px">II</button>
    </div>
    <div id="rBoss" hidden><img id="rBossImg" alt=""><div class="bx"><div id="rBossName"></div><div class="bar"><i id="rBossB"></i></div></div></div>
    <button class="btn" id="retire" data-a="retire" hidden>Retirarse con el botín</button>
  </div>

  <div id="dlg" hidden>
    <div id="dpor"></div>
    <div class="dbody"><div id="dname"></div><div id="dtext"></div><div id="dchoices"></div></div>
    <i id="dnext"></i>
  </div>

  <div id="ov" class="ov" hidden><div class="ovbox pnl" id="ovbox"></div></div>

  <div id="title" class="ov" hidden>
    <div class="tbox">
      <h1 class="tname">Raíces del Valle</h1>
      <p class="ttag">Heredas una granja gris en un valle que se marchita. Cultiva, baja a las grietas, forja tus armas y descubre qué hizo tu abuela hace diez años.</p>
      <div id="tcont"></div>
      <label for="pname">Tu nombre</label>

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function silhouette(im,col){if(!im)return null;const c=mkCanvas(im.width,im.height),g=c.getContext('2d');g.drawImage(im,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return c;}
function recolor(im,sx,sy,w,h,fn){const c=mkCanvas(w,h),g=c.getContext('2d');g.drawImage(im,sx,sy,w,h,0,0,w,h);const d=g.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){if(!a[i+3])continue;const r=fn(a[i],a[i+1],a[i+2]);a[i]=r[0];a[i+1]=r[1];a[i+2]=r[2];}g.putImageData(d,0,0);return c;}
function buildDerived(){
 for(const k in IMG){if(k.startsWith('m_')||k.startsWith('b_')||k.startsWith('c_'))DER['W'+k]=silhouette(IMG[k],'#ffffff');if(k.startsWith('m_'))DER['G'+k]=silhouette(IMG[k],'#ffd23f');}
 const t=IMG.terrain_spring;
 if(t){DER.pondDry=recolor(t,0,29*16,48,48,(r,g,b)=>b>r+30&&b>g-10?(r+g+b>560?[205,180,140]:[150,112,78]):[r,g,b]);}
 if(IMG.w_leaf)DER.leafAut=recolor(IMG.w_leaf,0,0,72,7,(r,g,b)=>{const l=r*.3+g*.59+b*.11;return[Math.min(255,l*1.2+80),Math.min(255,l*.75+28),l*.25+12];});
 const n=IMG.nature;
 if(n){const grey=(r,g,b)=>{const l=(r*.3+g*.59+b*.11);return[l*.62+40,l*.55+34,l*.72+44];};for(const k of ['bush1','bush2','bush3']){const s=SPR[k];DER['dead_'+k]=recolor(n,s[1],s[2],s[3],s[4],grey);}}

const P2=v=>Math.round(v/2);
function rect(c,x,y,w,h){bx.fillStyle=c;bx.fillRect(Math.round(x),Math.round(y),w,h);}
function blit(im,sx,sy,sw,sh,dx,dy,flip){if(!im)return;dx=Math.round(dx);dy=Math.round(dy);if(flip){bx.save();bx.translate(dx+sw,dy);bx.scale(-1,1);bx.drawImage(im,sx,sy,sw,sh,0,0,sw,sh);bx.restore();}else bx.drawImage(im,sx,sy,sw,sh,dx,dy,sw,sh);}
function natSheet(){const se=S?season():0;return se===1?IMG.nature_summer:se===2?IMG.nature_autumn:IMG.nature;}
function sprite(name,ax,ay,o={}){const s=SPR[name];if(!s)return;let im=o.im||(s[0]==='N'?(o.base?IMG.nature:natSheet()):IMG[SHEETK[s[0]]]);if(o.alpha!=null)bx.globalAlpha=o.alpha;blit(im,s[1],s[2],s[3],s[4],ax-Math.floor(s[3]/2),ay-s[4],o.flip);if(o.alpha!=null)bx.globalAlpha=1;}
function shadowAt(ax,ay,w=12,al=1){const im=IMG.shadow;if(!im)return;const ga=bx.globalAlpha;bx.globalAlpha=ga*.3*al;if(w===12)bx.drawImage(im,Math.round(ax-6),Math.round(ay-4));else{const h=Math.max(3,Math.round(w*.4));bx.drawImage(im,0,0,12,7,Math.round(ax-w/2),Math.round(ay-h*.6),w,h);}bx.globalAlpha=ga;}
function pxDisk(cx,cy,r,c){bx.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));bx.fillRect(cx-w,cy+y,w*2+1,1);}}
function pxRing(cx,cy,r,c){bx.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);let px=-1;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));bx.fillRect(cx-w,cy+y,1,1);bx.fillRect(cx+w,cy+y,1,1);}for(let x=-r;x<=r;x++){const h=Math.round(Math.sqrt(Math.max(0,r*r-x*x)));bx.fillRect(cx+x,cy-h,1,1);bx.fillRect(cx+x,cy+h,1,1);}}
function icon(k,ax,ay){const p=ICONS[k];if(!p||!IMG.icons)return;blit(IMG.icons,p[0]*16,p[1]*16,16,16,ax-8,ay-16);}
function rotBlit(im,sx,sy,sw,sh,cx,cy,ang){if(!im)return;const a=Math.round(ang/(Math.PI/8))*(Math.PI/8);bx.save();bx.translate(Math.round(cx),Math.round(cy));bx.rotate(a);bx.drawImage(im,sx,sy,sw,sh,-Math.round(sw/2),-Math.round(sh/2),sw,sh);bx.restore();}
/* character sheets: 4 columns (down, up, left, right) x rows (walk frames, then attack) */
function drawChar(key,wx,wy,dir,face,walk,moving,o={}){const im=IMG['c_'+key];if(!im)return;const col=dir==='down'?0:dir==='up'?1:(face<0?2:3);const rows=im.height/16;
 let row=0;if(o.attack&&rows>4)row=4;else if(moving)row=rows>=4?Math.floor(walk/1.55)%4:Math.floor(walk/2.2)%2;
 let c2=col;if(o.pose&&rows>o.pose[1]){c2=o.pose[0];row=o.pose[1];}
 const ax=P2(wx),ay=P2(wy);if(!o.noShadow)shadowAt(ax,ay);if(o.alpha!=null)bx.globalAlpha=o.alpha;bx.drawImage(o.flash?DER['Wc_'+key]:im,c2*16,row*16,16,16,ax-8,ay-15,16,16);bx.globalAlpha=1;}
function faceSrc(who){const k=CAST[who];return k?asrc('f_'+k):null;}
const OVL=[];
function label(ax,ay,t,o={}){OVL.push({x:ax,y:ay,t,c:o.c||'#fff6dc',s:o.s||13,w:o.w||600,a:o.a==null?1:o.a,bg:o.bg});}
function drawOverlay(g){g.textAlign='center';g.textBaseline='alphabetic';for(const l of OVL){const x=(l.x-CX)*PX,y=(l.y-CY)*PX;g.globalAlpha=l.a;g.font=`${l.w} ${l.s}px 'Pixelify Sans',sans-serif`;
 if(l.bg){const tw=g.measureText(l.t).width+12,h=l.s+8;g.fillStyle='#131b1b';g.fillRect(Math.round(x-tw/2)-2,Math.round(y-h+3)-2,Math.round(tw)+4,h+4);g.fillStyle=l.bg;g.fillRect(Math.round(x-tw/2),Math.round(y-h+3),Math.round(tw),h);g.fillStyle=l.c;g.fillText(l.t,x,y-2);}
 else{g.lineJoin='round';g.lineWidth=Math.max(3,l.s*.28);g.strokeStyle='rgba(19,27,27,.92)';g.strokeText(l.t,x,y);g.fillStyle=l.c;g.fillText(l.t,x,y);}}g.globalAlpha=1;}

 for(const k of ['aspersor','aspersor2','espanta','golem'])if(inv(k)||placedN(k))h+=`<button class="seed ${MODE.type==='place'&&MODE.id===k?'on':''}" data-a="mode" data-v="place:${k}">${ic(k)}<span>${ITEMS[k].n}<small>×${inv(k)}</small></span></button>`;
 $('#hotbar').innerHTML=h;}
ACT.mode=v=>{if(v==='auto')MODE={type:'auto'};else{const[a,b]=v.split(':');MODE={type:a,id:b};if(a==='place')toast('Va en la esquina entre casillas que tienes delante. La zona marcada es la que cubrirá.',3600);}renderHotbar();};
function refreshAll(){if(!S)return;updHUD();renderHotbar();if(curTab){const sh=$('#sheet'),st=sh.scrollTop;renderSheet(curTab);sh.scrollTop=st;}}

/* Sheets */
function openSheet(t){curTab=t;renderSheet(t);const sh=$('#sheet');sh.hidden=false;sh.scrollTop=0;actHeld=false;}
function closeSheet(){curTab=null;$('#sheet').hidden=true;}
ACT.close=closeSheet;ACT.mochila=()=>openSheet('mochila');
function sheetHead(t,sub){return `<header><div><h2>${t}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><button class="x" data-a="close" aria-label="Cerrar">×</button></header>`;}
function renderSheet(t){$('#sheet').innerHTML=({mercado:sheetMercado,grieta:sheetGrieta,forja:sheetForja,mochila:sheetMochila,cocina:sheetCocina})[t]();}
function relLabel(id){const h=hearts(id);switch(NPCS[id].kind){case 'mentor':return h>=9?'Mentor de por vida':'Mentor';case 'aprendiz':return h>=9?'Aprendiz aventajado':'Aprendiz';case 'rival':return h>=9?'Rival de honor':'Rivalidad';case 'misterio':return S.flags.eiraName?'Familia':'Misterio';default:return S.partner===id?(S.married?'Matrimonio':'Pareja'):(h>=5?'Amistad · romance posible':'Amistad');}}

function sheetMercado(){
 let h=sheetHead('Mercado de Pía','Vende tu cosecha, compra lo básico y encarga mejoras para la granja.');
 h+='<h3>Vender</h3>';const sell=Object.keys(S.inv).filter(k=>ITEMS[k]&&ITEMS[k].p>0&&inv(k)>0);
 if(!sell.length)h+='<p class="sub">No tienes nada que vender. Cosecha o baja a una grieta.</p>';
 else{const crops=sell.filter(k=>ITEMS[k].k==='crop');if(crops.length){const tot=crops.reduce((a,k)=>a+ITEMS[k].p*inv(k),0);h+=`<div class="row" style="margin-bottom:8px"><button class="btn" data-a="sellcrops">Vender toda la cosecha (+${tot})</button></div>`;}
  h+='<div class="list">'+sell.map(k=>`<div class="item">${ic(k)}<span class="nm">${ITEMS[k].n} <span class="sub">· ${ITEMS[k].p} c/u</span></span><span class="ct">×${inv(k)}</span><button class="btn alt sm" data-a="sell" data-v="${k}:1">1</button><button class="btn alt sm" data-a="sell" data-v="${k}:all">Todo</button></div>`).join('')+'</div>';}
 h+='<h3>Comprar</h3><div class="list">';
 for(const s of SHOP){if(!s.req())continue;h+=`<div class="item">${ic(s.id)}<span class="nm">${ITEMS[s.id].n}${s.id==='ramo'?'<br><span class="sub">Regálalo con 8 corazones para empezar una relación.</span>':s.id==='colgante'?'<br><span class="sub">Una propuesta para toda la vida.</span>':''}</span><button class="btn alt sm" data-a="buy" data-v="${s.id}" ${S.gold<s.gold?'disabled':''}>${s.gold}</button></div>`;}
 h+='</div><h3>Mejoras de la granja</h3><div class="list">';
 const bl=BUILD.filter(b=>b.req());if(!bl.length)h+='<p class="sub">Avanza en la historia para desbloquear más mejoras.</p>';
 for(const b of bl)h+=`<div class="card"><div class="body"><div class="name">${b.n}</div><p class="sub">${b.d}</p>${costHTML(b.in,b.gold)}</div><button class="btn sm" data-a="build" data-v="${b.id}" ${canPay(b.in,b.gold)?'':'disabled'}>Construir</button></div>`;
 return h+'</div>';}
ACT.sell=v=>{const[k,n]=v.split(':');const q=n==='all'?inv(k):1;S.gold+=ITEMS[k].p*q;addI(k,-q);snd('coin');refreshAll();save();};
ACT.sellcrops=()=>{let t=0;for(const k of Object.keys(S.inv))if(ITEMS[k]&&ITEMS[k].k==='crop'&&ITEMS[k].p>0){t+=ITEMS[k].p*inv(k);delete S.inv[k];}S.gold+=t;toast(`+${t} de oro`);snd('coin');refreshAll();save();};
ACT.buy=id=>{const s=SHOP.find(x=>x.id===id);if(S.gold<s.gold)return;S.gold-=s.gold;addI(id);toast(`Compras: ${ITEMS[id].n}`);refreshAll();save();};
ACT.build=id=>{const b=BUILD.find(x=>x.id===id);if(!canPay(b.in,b.gold))return;S.gold-=b.gold;take(b.in);if(b.fx)b.fx();S.farm.deco[id]=1;snd('powerup');closeSheet();refreshAll();save();say([{who:'pia',t:`¡Hecho! Los carpinteros del pueblo ya tienen ${b.n.toLowerCase()} lista en tu granja. Son rapidísimos.`}]);};

function sheetGrieta(){
 let h=sheetHead('La grieta','Cada bajada cuesta 20 de energía. Si caes, conservas la mitad del botín.');
 if(S.buff)h+=`<div class="card"><div class="body"><div class="name">Plato preparado</div><p class="sub">${ITEMS[S.buff.id].n}: ${BUFFS[S.buff.b]}</p></div></div>`;
 h+='<h3>Historia</h3><div class="list">';let any=false;
 for(const r of REGIONS){const un=S.bossDone[r.boss]||(S.ch===r.ch&&S.stage==='rift');if(!un)continue;any=true;const done=S.bossDone[r.boss];
  h+=`<div class="card"><div class="body"><div class="name">${REG[r.id].n}</div><p class="sub">${done?'Guardián en la sala 6 · materiales: '+REG[r.id].drops.map(k=>ITEMS[k].n).join(', '):'Jefe: '+BOSS[r.boss].n}</p><div class="row"><span class="tag ${done?'':'gold'}">${done?'Purificada':'Jefe pendiente'}</span></div></div><button class="btn" data-a="run" data-v="${r.id}" ${S.energy<20?'disabled':''}>Bajar</button></div>`;}
 if(!any)h+='<p class="sub">La grieta todavía está cerrada. Sigue el objetivo de arriba.</p>';
 h+='</div>';
 if(S.flags.post){const cps=[];for(let f=1;f<=S.abyss.best+1;f+=10)cps.push(f);
  h+=`<h3>El Abismo</h3><div class="card"><div class="body"><div class="name">Pisos sin fondo</div><p class="sub">Enemigos más duros en cada piso, un jefe cada 10 y armas con rareza y afijos. Retírate entre pisos para guardar el botín. Récord: piso ${S.abyss.best}.</p><div class="row">${cps.map(f=>`<button class="btn sm ${f===cps[cps.length-1]?'':'alt'}" data-a="abyss" data-v="${f}" ${S.energy<20?'disabled':''}>Piso ${f}</button>`).join('')}</div></div></div>`;
  const dd=S.dailyDay===S.day;h+=`<div class="card" style="margin-top:8px"><div class="body"><div class="name">Grieta del día</div><p class="sub">Empieza en tu último punto de control con 2 mejoras extra y esencia doble. Una vez al día.</p></div><button class="btn" data-a="daily" ${dd||S.energy<20?'disabled':''}>${dd?'Hecha':'Bajar'}</button></div>`;
  h+=`<h3>Raíces · mejoras permanentes</h3><p class="sub" style="margin-bottom:8px">Tienes <b style="color:#c9a6ff">${S.esencia}</b> de esencia.</p><div class="list">`;
  for(const k in TAL){const l=S.talents[k]||0,T_=TAL[k],c=T_.cost(l),mx=l>=T_.max;h+=`<div class="item"><span class="nm"><b>${T_.n}</b> · nivel ${l}<br><span class="sub">${T_.d}</span></span><button class="btn alt sm" data-a="talent" data-v="${k}" ${mx||S.esencia<c?'disabled':''}>${mx?'Máx.':`<i class="ess" style="display:inline-block;margin-right:5px"></i>${c}`}</button></div>`;}
  h+='</div>';}
 return h;}
ACT.run=id=>startRun(id);
ACT.abyss=f=>startRun('abismo',{abyss:1,floor:+f});
ACT.daily=()=>{if(S.energy<20)return;S.dailyDay=S.day;startRun('abismo',{abyss:1,floor:Math.floor(S.abyss.best/10)*10+1,daily:1});};
ACT.talent=k=>{const l=S.talents[k]||0,c=TAL[k].cost(l);if(S.esencia<c||l>=TAL[k].max)return;S.esencia-=c;S.talents[k]=l+1;snd('magic');refreshAll();save();};

function wDmg(wp){return WEAPONS[wp.t].dmg*(1+.1*wp.lvl)*RAR[wp.rar].m;}
function maxLvl(){return S.flags.post?999:5+(S.flags.tob6?10:0)+(S.bossDone.lodo?5:0);}
function upCost(wp){const l=wp.lvl;if(S.flags.post&&l>=15)return{gold:Math.round(150*(l+1)),ess:Math.round(6*Math.pow(1.16,l-14)),in:{}};
 const m=S.flags.tob3?.8:1;const gold=Math.round(60*Math.pow(l+1,1.6)*m);let req;if(l<5)req={piedra:5+l*2,madera:5};else if(l<10)req={cobre:2+(l-5)*2};else if(l<15)req={hierro:2+(l-10)*2,brasa:1+(l-10)};else req={escama:2+(l-15),ceniza:2+(l-15)};return{gold,in:req,ess:0};}
function sheetForja(){
 const wp=S.weapons[S.eq],W=WEAPONS[wp.t],c=upCost(wp),ml=maxLvl();
 let h=sheetHead('Forja de Tobías','Mejora tu arma, forja nuevas y fabrica artefactos para la granja.');
 h+=`<h3>Arma equipada</h3><div class="card"><div class="body"><div class="name rar${wp.rar}">${W.n} · nv. ${wp.lvl}</div><p class="sub">${W.d}</p><p class="sub">Daño ${wDmg(wp).toFixed(1)} · ${W.rate} disparos/s · ${RAR[wp.rar].n}</p>${wp.aff.map(a=>`<div class="aff">${AFF[a.k].n(a.v)}</div>`).join('')}${wp.lvl<ml?costHTML(c.in,c.gold,c.ess):''}</div><button class="btn sm" data-a="upgrade" ${wp.lvl>=ml||!canPay(c.in,c.gold,c.ess)?'disabled':''}>${wp.lvl>=ml?'Máx.':'Mejorar'}</button></div>`;
 if(wp.lvl>=ml&&!S.flags.post)h+=`<p class="sub" style="margin-top:6px">Nivel máximo por ahora. ${!S.flags.tob6?'Tobías sabe templar mejor el acero si confías en él.':''}</p>`;
 h+='<h3>Tus armas</h3><div class="list">';
 S.weapons.forEach((x,i)=>{const X=WEAPONS[x.t];h+=`<div class="card"><div class="body"><div class="name rar${x.rar}">${X.n} · nv. ${x.lvl}</div><p class="sub">${RAR[x.rar].n} · daño ${wDmg(x).toFixed(1)}</p>${x.aff.map(a=>`<div class="aff">${AFF[a.k].n(a.v)}</div>`).join('')}</div><div class="acts" style="flex-direction:column">${i===S.eq?'<span class="tag gold">Equipada</span>':`<button class="btn alt sm" data-a="equip" data-v="${i}">Equipar</button>`}${S.flags.post&&i!==S.eq?`<button class="btn sm warn" data-a="salvage" data-v="${i}">Desguazar</button>`:''}</div></div>`;});
 h+='</div><h3>Recetas de armas</h3><div class="list">';let any=false;
 for(const k in WREC){const r=WREC[k];if(!r.req())continue;any=true;const owned=S.wtypes.includes(k);h+=`<div class="card"><div class="body"><div class="name">${WEAPONS[k].n}</div><p class="sub">${WEAPONS[k].d}</p>${costHTML(r.in,r.gold)}</div><button class="btn sm" data-a="wcraft" data-v="${k}" ${owned||!canPay(r.in,r.gold)?'disabled':''}>${owned?'Forjada':'Forjar'}</button></div>`;}
 if(!any)h+='<p class="sub">Derrota al jefe del Bosque Gris para conseguir tu primera receta.</p>';
 h+='</div><h3>Artefactos de granja</h3><div class="list">';
 for(const m of MAKE){if(!m.req())continue;h+=`<div class="card"><div class="body"><div class="name">${ITEMS[m.id].n} ${inv(m.id)?`<span class="tag">tienes ${inv(m.id)}</span>`:''}</div><p class="sub">${ITEMS[m.id].d}</p>${costHTML(m.in,m.gold||0)}</div><button class="btn sm" data-a="make" data-v="${m.id}" ${canPay(m.in,m.gold||0)?'':'disabled'}>Fabricar</button></div>`;}
 return h+'</div>';}
ACT.upgrade=()=>{const wp=S.weapons[S.eq],c=upCost(wp);if(wp.lvl>=maxLvl()||!canPay(c.in,c.gold,c.ess))return;S.gold-=c.gold;S.esencia-=c.ess||0;take(c.in);wp.lvl++;snd('powerup');toast(`${WEAPONS[wp.t].n} sube a nivel ${wp.lvl}`);refreshAll();save();};
ACT.equip=i=>{S.eq=+i;refreshAll();save();};
ACT.salvage=i=>{i=+i;if(i===S.eq)return;const x=S.weapons[i];const e=Math.round(5*(x.rar+1)*(1+x.lvl/5));S.esencia+=e;S.weapons.splice(i,1);if(S.eq>i)S.eq--;toast(`+${e} de esencia`);refreshAll();save();};
ACT.wcraft=k=>{const r=WREC[k];if(!canPay(r.in,r.gold)||S.wtypes.includes(k))return;S.gold-=r.gold;take(r.in);S.wtypes.push(k);S.weapons.push({t:k,lvl:0,rar:0,aff:[]});S.eq=S.weapons.length-1;jing('level');closeSheet();say([{who:'tobias',t:`${WEAPONS[k].n}. ${pick(['Pesa lo justo.','Cuídala y te cuidará.','Mi mejor trabajo este mes. Que no se entere el alcalde.'])}`},{who:'narr',t:'La has equipado.'}]);refreshAll();save();};
ACT.make=id=>{const m=MAKE.find(x=>x.id===id);if(!canPay(m.in,m.gold||0))return;S.gold-=m.gold||0;take(m.in);addI(id);toast(`${ITEMS[id].n} fabricado. Elígelo en la bandeja de la granja para colocarlo.`,3000);refreshAll();save();};

function sheetMochila(){
 let h=sheetHead('Mochila',`Esencia: ${S.esencia} · Cosechas: ${S.stats.harvest} · Enemigos: ${S.stats.kills}`);
 const groups=[['Cosecha','crop'],['Comida','food'],['Platos para la grieta','dish'],['Materiales','mat'],['Objetos especiales','key'],['Regalos','gift'],['Artefactos','place']];
 for(const[n,k]of groups){const it=Object.keys(S.inv).filter(x=>ITEMS[x]&&ITEMS[x].k===k&&inv(x)>0);if(!it.length)continue;h+=`<h3>${n}</h3><div class="grid">`;
  for(const x of it){let a='';if(k==='food')a=`<button class="btn alt sm" data-a="eat" data-v="${x}">Comer</button>`;if(k==='dish')a=`<button class="btn alt sm" data-a="prep" data-v="${x}" ${S.buff?'disabled':''}>Llevar</button>`;h+=`<div class="item">${ic(x)}<span class="nm">${ITEMS[x].n}${ITEMS[x].e?`<br><span class="sub">+${ITEMS[x].e} energía</span>`:''}${ITEMS[x].buff?`<br><span class="sub">${BUFFS[ITEMS[x].buff]}</span>`:''}</span><span class="ct">${inv(x)}</span>${a}</div>`;}
  h+='</div>';}
 if(!Object.keys(S.inv).length)h+='<p class="sub" style="margin-top:12px">Vacía. Cosecha algo o limpia escombros del huerto.</p>';
 h+=`<h3>Vecinos</h3><p class="sub" style="margin-bottom:8px">Cada corazón te da +2 de vida en la grieta (ahora +${totalHearts()*2}). Viven en el pueblo, al este de tu granja.</p><div class="list">`;
 for(const id in NPCS){const N=NPCS[id];if(!N.avail())continue;h+=`<div class="card"><img class="portrait" src="${faceSrc(id)}" alt=""><div class="body"><div class="name">${npcName(id)}</div><div class="row"><span class="tag gold">${relLabel(id)}</span>${S.npc[id].t===S.day?'<span class="tag">hablado hoy</span>':''}</div>${heartsHTML(id)}<p class="sub">Le encanta: ${N.love.map(k=>ITEMS[k].n).join(', ')}</p></div></div>`;}
 h+=`</div><h3>Partida</h3><p class="sub" style="margin-bottom:8px">Se guarda sola en este navegador. Para pasarla a otro dispositivo, exporta el código y pégalo allí.</p><div class="row"><button class="btn alt" data-a="mute">${muted?'Activar sonido':'Silenciar'}</button><button class="btn alt" data-a="credits">Créditos</button><button class="btn alt" data-a="export">Exportar</button><button class="btn alt" data-a="import">Importar</button><button class="btn warn" data-a="reset">${resetArm>Date.now()?'Toca otra vez para borrar':'Borrar partida'}</button></div>`;
 return h;}
function sheetCocina(){let h=sheetHead('Cocina','Los platos de energía se comen desde la mochila. Los de grieta se llevan a la próxima bajada.');h+='<div class="list" style="margin-top:6px">';
 for(const c of COOK){const I=ITEMS[c.id];h+=`<div class="card"><div class="body"><div class="name">${I.n} ${inv(c.id)?`<span class="tag">tienes ${inv(c.id)}</span>`:''}</div><p class="sub">${I.e?`+${I.e} energía al comerlo`:BUFFS[I.buff]}</p>${costHTML(c.in)}</div><button class="btn sm" data-a="cook" data-v="${c.id}" ${has(c.in)?'':'disabled'}>Cocinar</button></div>`;}
 return h+'</div>';}
ACT.eat=k=>{if(S.energy>=S.maxE){toast('Ya tienes la energía al máximo.');return;}S.energy=Math.min(S.maxE,S.energy+ITEMS[k].e);addI(k,-1);snd('heal');toast(`+${ITEMS[k].e} de energía`);refreshAll();save();};
ACT.prep=k=>{if(S.buff)return;S.buff={id:k,b:ITEMS[k].buff};addI(k,-1);toast(`${ITEMS[k].n} en la mochila para la próxima grieta.`);refreshAll();save();};
ACT.cook=k=>{const c=COOK.find(x=>x.id===k);if(!has(c.in))return;take(c.in);addI(k);snd('pick');toast(`Cocinas: ${ITEMS[k].n}`);refreshAll();save();};
ACT.mute=()=>{muted=!muted;if(muted)musEl.pause();else{unlockAudio();playMusic(true);}refreshAll();};
ACT.export=()=>{save();const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));openOv(`<h2>Exportar partida</h2><p class="sub">Copia este código y guárdalo en tus notas.</p><textarea id="expt" readonly>${code}</textarea><div class="row"><button class="btn" data-a="copyexp">Copiar</button><button class="btn alt" data-a="closeov">Cerrar</button></div>`);};
ACT.copyexp=()=>{const t=$('#expt');try{navigator.clipboard.writeText(t.value).then(()=>toast('Código copiado'),()=>{t.select();toast('Selecciona y copia el texto');});}catch(e){t.select();toast('Selecciona y copia el texto');}};
ACT.import=()=>openOv(`<h2>Importar partida</h2><p class="sub">Pega aquí el código exportado. Sustituye la partida actual.</p><textarea id="impt"></textarea><div class="row"><button class="btn" data-a="doimport">Cargar</button><button class="btn alt" data-a="closeov">Cancelar</button></div>`);
ACT.doimport=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob($('#impt').value.trim()))));if(!s.farm||!s.npc)throw 0;S=migrate(s);closeOv();closeSheet();placePlayerFromSave();save();refreshAll();toast('Partida cargada');}catch(e){toast('Ese código no es válido. Cópialo entero e inténtalo otra vez.',3000);}};
ACT.reset=()=>{if(resetArm>Date.now()){try{localStorage.removeItem(KEY);}catch(e){}location.reload();return;}resetArm=Date.now()+3000;refreshAll();};

ACT.journal=()=>{const o=objective();const dl=S.stage==='prep'&&S.ch>0&&CH[S.ch].prep&&CH[S.ch].prep();
 openOv(`<h2>${CH[Math.min(S.ch,6)].t}</h2><p>${esc(o.d)}</p>${S.stage==='prep'&&S.ch>0&&CH[S.ch].take&&!dl?costHTML(CH[S.ch].take,CH[S.ch].gold||0):''}<h3>Capítulos</h3><div class="chapters">${CH.map((c,i)=>`<div class="${i<S.ch?'done':i===S.ch?'cur':''}"><b>${i<S.ch?'✓':i===S.ch?'›':'·'}</b><span>${i<=S.ch?c.t:'???'}</span></div>`).join('')}</div><p class="sub">Día ${S.day} · Año ${year()} · Huerto ${S.farm.n}×${S.farm.n}</p><button class="btn alt" data-a="closeov">Cerrar</button>`);};
function deliver(){const c=CH[S.ch];if(S.stage!=='prep'||!c.prep())return false;if(c.take)take(c.take);if(c.gold)S.gold-=c.gold;S.stage='rift';jing('secret');say(c.give(),()=>{refreshAll();save();});refreshAll();return true;}

/* ================= NPC INTERACTION ================= */
function talk(id){const n=S.npc[id];const np=NP[id];if(np){np.face=P.x<np.x?-1:1;np.dir=Math.abs(P.x-np.x)>Math.abs(P.y-np.y)?'side':P.y<np.y?'up':'down';np.wait=3;}
 if(S.stage==='prep'&&CH[S.ch]&&CH[S.ch].who===id&&CH[S.ch].prep()){if(n.t!==S.day){n.t=S.day;addP(id,4);}deliver();return;}
 let lines;
 if(n.t!==S.day){n.t=S.day;addP(id,4);const h=hearts(id);for(const th of [3,6,9]){if(h>=th&&!S.flags[id+th]&&HEV[id][th]){S.flags[id+th]=1;lines=HEV[id][th]();break;}}
  if(!lines){const L=LINES[id][h<4?0:h<8?1:2];lines=[{who:id,t:L[(S.day+id.length)%L.length]}];}}
 else lines=[{who:id,t:AGAIN[id]}];
 const last=lines[lines.length-1];
 if(n.g!==S.day&&!last.choices)last.choices=[{t:'Hacer un regalo',fn:()=>giftMenu(id)},{t:'Adiós',fn:null}];
 say(lines,()=>save());refreshAll();}
function giftMenu(id){const items=Object.keys(S.inv).filter(k=>ITEMS[k]&&!['place','key'].includes(ITEMS[k].k)&&inv(k)>0);
 openOv(`<h2>Regalo para ${npcName(id)}</h2><p class="sub">Le encanta: ${NPCS[id].love.map(k=>ITEMS[k].n).join(', ')}.</p>${items.length?`<div class="list">${items.map(k=>`<button class="item tap" data-a="give" data-v="${id}:${k}" style="text-align:left">${ic(k)}<span class="nm">${ITEMS[k].n}</span><span class="ct">×${inv(k)}</span></button>`).join('')}</div>`:'<p class="sub">No tienes nada que regalar todavía.</p>'}<button class="btn alt" data-a="closeov">Cancelar</button>`);}

function pushOutRects(o,r,rects){for(const b of rects){if(o.x+r<b.x||o.x-r>b.x+b.w||o.y+r<b.y||o.y-r>b.y+b.h)continue;const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h),dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;if(d2<r*r){if(d2<.01){const l=o.x-b.x,rt=b.x+b.w-o.x,t=o.y-b.y,bt=b.y+b.h-o.y,m=Math.min(l,rt,t,bt);if(m===l)o.x=b.x-r;else if(m===rt)o.x=b.x+b.w+r;else if(m===t)o.y=b.y-r;else o.y=b.y+b.h+r;continue;}const d=Math.sqrt(d2);o.x=cx+dx/d*r;o.y=cy+dy/d*r;}}}

  case 'till':t.s='soil';act('till',px,py);return true;

 else{for(const v of S.farm.vo||[])if(v.o==='aspersor'||v.o==='aspersor2')for(const[x,y] of objTiles(v.o,v.x,v.y))water(x,y);

  if(helpers){let k=0;forField(t=>{if(k<helpers&&t.c&&!t.w){t.w=true;k++;}});if(k)msgs.push({who:'narr',t:`${S.married?NPCS[S.partner].n+(S.flags.nilo3?' y Nilo han':' ha'):'Nilo ha'} regado ${k} cultivos antes de que despertaras.`});}}
 let gh=0,gr=0;const gt=new Set();for(const v of S.farm.vo||[])if(v.o==='golem')for(const[X,Y] of objTiles('golem',v.x,v.y))gt.add(Y*10+X);for(const gi of gt){const u=tiles[gi];if(!u.c)continue;const C=CROPS[u.c.id];if(u.c.age<C.d)continue;if(C.ess)S.esencia+=C.ess;else addI(u.c.id);gh++;S.stats.harvest++;S.stats.seasonH++;if(C.re)u.c.age=C.d-C.re;else{const id=u.c.id;u.c=null;if(S.gold>=C.seed&&(S.farm.deco.invernadero||C.se.includes(ns))){S.gold-=C.seed;u.c={id,age:0};gr++;}}}

 if(S.married&&Math.random()<.3){const d=pick(['sopa','tortilla','tarta','guiso']);addI(d);msgs.push({who:S.partner,t:`Te he dejado ${ITEMS[d].n.toLowerCase()} en la mesa. Para que no bajes a las grietas con el estómago vacío.`});}
 let wd=0;for(let k=0;k<12&&wd<2;k++){const n=S.farm.n,i=ri(0,n-1)*10+ri(0,n-1),t=tiles[i];if(t.s==='grass'&&!t.d&&!t.o&&!t.c){t.d=Math.random()<.7?'hierba':Math.random()<.5?'piedra':'tronco';wd++;}}

/* vertex (vx,vy) is the corner shared by tiles (vx-1..vx, vy-1..vy); dx,dy = tile centre minus vertex, in tiles */
const OBJA={aspersor:{c:'#5fb8f5',f:(dx,dy)=>Math.abs(dx)<1&&Math.abs(dy)<1},

function objTiles(o,vx,vy){const n=S.farm.n,A=OBJA[o],L=[];if(!A)return L;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(A.f(x+.5-vx,y+.5-vy))L.push([x,y]);return L;}
const vObj=(vx,vy)=>(S.farm.vo||[]).find(v=>v.x===vx&&v.y===vy);
const placedN=k=>S?(S.farm.vo||[]).filter(v=>v.o===k).length:0;
const vertW=(vx,vy)=>({x:(FX0+vx)*TS,y:(FY0+vy)*TS});
/* the first corner in front of the player (never under the feet) */
function vertTarget(){const n=S.farm.n,gx=P.x/TS-FX0,gy=(P.y-4)/TS-FY0;
 const vx=P.dx>0?Math.ceil(gx+.3):P.dx<0?Math.floor(gx-.3):Math.round(gx),vy=P.dy>0?Math.ceil(gy+.38):P.dy<0?Math.floor(gy-.2):Math.round(gy);
 if(vx<0||vy<0||vx>n||vy>n)return null;const o=vObj(vx,vy);

function doVert(t){if(!t.a)return;if(!S.farm.vo)S.farm.vo=[];const w=vertW(t.vx,t.vy);
 if(t.a==='place'){if(vObj(t.vx,t.vy)||inv(MODE.id)<=0)return;S.farm.vo.push({x:t.vx,y:t.vy,o:MODE.id});addI(MODE.id,-1);act('place',w.x,w.y,MODE.id);}
 else{const i=S.farm.vo.findIndex(v=>v.x===t.vx&&v.y===t.vy);if(i<0)return;const o=S.farm.vo[i].o;S.farm.vo.splice(i,1);act('pickup',w.x,w.y,o);addI(o);}
 curTarget=null;setTimeout(()=>{refreshAll();save();},0);}

function tmat(M,E,tx,ty){tx=clamp(tx,0,M.w-1);ty=clamp(ty,0,M.h-1);const c=M.g[ty*M.w+tx];

const grp=m=>m===3?2:m;

 for(let y=0;y<8;y++)for(let x=0;x<8;x++){const t=S.farm.tiles[y*10+x];t.d=null;if((x+y)%3){t.s='soil';t.c={id:pick(['nabo','fresa','patata','tomate']),age:ri(2,8)};t.w=x%2===0;}}
 P.map='farm';updCam(1,true);
 if(s){$('#tcont').innerHTML=`<button class="btn" data-a="cont" style="width:100%">Continuar · ${esc(s.name)}, día ${(s.day-1)%SL+1} de ${SEASONS[Math.floor((s.day-1)/SL)%4].toLowerCase()}</button>`;$('#pname').placeholder='Nombre para una partida nueva';}
 $('#load').hidden=true;$('#title').hidden=false;booted=true;}

window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
