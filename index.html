:root{
  /* Wood-and-cream palette taken from the Ninja Adventure UI kit */
  --ink:#131b1b; --ink2:#262c2b; --wood:#9b513c; --wood-d:#6b3a2e; --orange:#f06733; --orange-d:#b8452a; --orange-l:#f9a16b;
  --cream:#f6eddf; --cream2:#eadcc5; --cream3:#d6c1a1; --paper:#fffaf2; --tdark:#3a2621; --tmute:#86675a;
  --teal:#5f8f8b; --leaf:#6fae3f; --danger:#d9443a; --violet:#8b5fd0; --gold:#f2b632;
  --f-pix:'RDig','Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;background:var(--ink);color:var(--tdark);overscroll-behavior:none}
body{margin:0;overflow:hidden;font-family:var(--f-body);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.px,.ico{image-rendering:pixelated}

/* Icons come from one 10x7 sheet of 16px cells */
.ico{display:inline-block;flex:none;width:24px;height:24px;background:url(icons.png?v=f114627b) no-repeat;background-size:240px 216px;vertical-align:middle}
.ico.s{width:16px;height:16px;background-size:160px 144px}
.ico.l{width:32px;height:32px;background-size:320px 288px}
.ico.xl{width:64px;height:64px;background-size:640px 576px}

/* Panels: cream fill, orange rim, ink outline */
.pnl{background:var(--cream);color:var(--tdark);border-radius:6px;box-shadow:0 0 0 3px var(--orange),0 0 0 6px var(--ink),0 9px 0 4px rgba(0,0,0,.28)}

#hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.pill{pointer-events:auto;background:var(--cream);color:var(--tdark);border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 var(--cream3);padding:3px 8px 5px;font-family:var(--f-pix);font-weight:600;font-size:15px;display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums;min-height:28px;box-sizing:border-box}
.pill.grow{flex:1;min-width:0}
.ibtn{cursor:pointer;padding:2px 6px 4px;border:0}
.ibtn:active{transform:translateY(2px)}
.bar{position:relative;height:10px;flex:1;min-width:30px;background:#3b2d2a;border-radius:3px;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--leaf);display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3)}
.bolt{width:9px;height:13px;flex:none;background:var(--orange);clip-path:polygon(60% 0,0 58%,45% 58%,30% 100%,100% 38%,55% 38%)}
.ess{width:10px;height:10px;background:#b28cff;transform:rotate(45deg);box-shadow:inset -2px -2px 0 #6c4fb0;flex:none;display:inline-block}
#obj{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:5;text-align:left;background:var(--cream);color:var(--tdark);border:0;border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 var(--cream3);padding:5px 10px 7px;font-size:13.5px;line-height:1.3;cursor:pointer;display:flex;gap:8px;align-items:center}
#obj b{font-family:var(--f-pix);font-weight:700;color:var(--wood);white-space:nowrap;font-size:15px}
#obj span{min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#obj.ready{box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--gold),inset 0 -3px 0 var(--cream3);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 0 6px #ffe39a,inset 0 -3px 0 var(--cream3)}}

#ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:flex-end;gap:12px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none}
#bagW{pointer-events:auto;position:relative;flex:none;margin-right:auto}
#bagBtn{position:relative;width:62px;height:62px;border:0;border-radius:10px;background:var(--cream);box-shadow:0 0 0 3px var(--ink),inset 0 -6px 0 var(--cream3),inset 0 3px 0 #fffaf2,0 6px 0 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#bagBtn>svg{margin-top:-3px;filter:drop-shadow(0 2px 0 rgba(58,38,33,.22))}
#bagBtn.on{background:#ffe9a8;box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--orange),inset 0 -6px 0 #e8c46a}
#bagBtn:active{transform:translateY(3px)}
#bagCur{position:absolute;right:-9px;top:-9px;width:30px;height:30px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center}
#bagCur .ico{width:24px;height:24px}
#hotbar{position:absolute;left:0;bottom:76px;width:min(282px,calc(100vw - 28px));max-height:min(52vh,420px);overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px;transform-origin:0 100%;animation:bagIn .14s ease-out}
#hotbar[hidden]{display:none}
@keyframes bagIn{from{opacity:0;transform:scale(.86)}}
#hotbar h4{grid-column:1/-1;margin:2px 2px -2px;font-family:var(--f-pix);font-weight:600;font-size:13px;color:var(--tmute)}
.seed{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;background:var(--paper);color:var(--tdark);border:0;border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 var(--cream3);padding:5px 3px 6px;font-family:var(--f-pix);font-weight:600;font-size:12.5px;cursor:pointer;line-height:1.05;text-align:center}
.seed span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%;overflow:hidden;hyphens:manual}
.seed.on{background:#ffe9a8;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--orange),inset 0 -3px 0 #e8c46a}
.seed small{display:block;color:var(--tmute);font-family:var(--f-body);font-weight:400;font-size:10.5px;margin-top:1px}
#act{pointer-events:auto;flex:none;width:84px;height:84px;border-radius:50%;border:0;background:var(--orange);box-shadow:inset 0 -6px 0 var(--orange-d),inset 0 4px 0 var(--orange-l),0 0 0 3px var(--ink),0 6px 0 3px rgba(0,0,0,.3);font-family:var(--f-pix);font-weight:700;font-size:14px;color:#fff6ea;text-shadow:0 2px 0 #7a2a16;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;padding:4px;gap:1px;touch-action:none;cursor:pointer}
#act small{font-weight:500;font-size:10.5px;opacity:.95;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#act .ico{filter:drop-shadow(0 2px 0 rgba(90,30,10,.6))}
#act.idle{background:var(--cream2);color:var(--tmute);text-shadow:none;box-shadow:inset 0 -6px 0 var(--cream3),0 0 0 3px var(--ink),0 6px 0 3px rgba(0,0,0,.3)}
#act.idle .ico{opacity:.35;filter:grayscale(1)}
#act.down{transform:translateY(4px);box-shadow:inset 0 -2px 0 var(--orange-d),0 0 0 3px var(--ink),0 2px 0 3px rgba(0,0,0,.3)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:calc(100% - env(safe-area-inset-top,0px) - 60px);overflow-y:auto;background:var(--cream);color:var(--tdark);border-radius:12px 12px 0 0;box-shadow:0 -4px 0 var(--orange),0 -7px 0 var(--ink);padding:0 14px calc(env(safe-area-inset-bottom,0px) + 22px);touch-action:pan-y;-webkit-overflow-scrolling:touch}
#sheet header{position:sticky;top:0;z-index:2;background:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px;border-bottom:2px dashed var(--cream3);margin-bottom:4px}
h2{font-family:var(--f-pix);font-weight:700;font-size:25px;color:var(--wood);margin:0;text-wrap:balance;line-height:1.05}
h3{font-family:var(--f-pix);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--tmute);margin:18px 0 8px}
p{margin:0}
.sub{color:var(--tmute);font-size:13.5px;line-height:1.45}
.list{display:flex;flex-direction:column;gap:9px}
.card{background:var(--paper);border-radius:6px;box-shadow:0 0 0 2px var(--cream3),0 3px 0 2px var(--cream3);padding:10px;display:flex;gap:10px;align-items:center}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .name{font-family:var(--f-pix);font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--f-pix);font-weight:600;font-size:15px;background:var(--orange);color:#fff7ea;border:0;border-radius:5px;box-shadow:inset 0 -4px 0 var(--orange-d),inset 0 2px 0 var(--orange-l),0 0 0 2px var(--ink);padding:6px 12px 9px;cursor:pointer;white-space:nowrap;text-shadow:0 1px 0 #8a2f1c;line-height:1.1}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--orange-d),0 0 0 2px var(--ink)}
.btn.alt{background:var(--cream2);color:var(--tdark);text-shadow:none;box-shadow:inset 0 -4px 0 var(--cream3),inset 0 2px 0 #fff6e6,0 0 0 2px var(--ink)}
.btn.warn{background:#c9493c;box-shadow:inset 0 -4px 0 #8f2c24,inset 0 2px 0 #e37a6c,0 0 0 2px var(--ink)}
.btn.sm{font-size:13.5px;padding:4px 9px 7px}
.btn:disabled{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.x{background:var(--cream2);border:0;border-radius:5px;box-shadow:inset 0 -3px 0 var(--cream3),0 0 0 2px var(--ink);width:38px;height:38px;font-family:var(--f-pix);font-weight:700;font-size:20px;color:var(--tdark);cursor:pointer;flex:none}
.tag{display:inline-block;font-family:var(--f-pix);font-weight:500;font-size:12px;padding:0 7px 1px;border-radius:4px;background:var(--cream2);color:var(--tmute);box-shadow:0 0 0 1px var(--cream3)}
.tag.gold{background:#ffe9a8;color:#7a4c0c;box-shadow:0 0 0 1px #e0b44e}
.cost{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cost span{font-size:12px;padding:1px 7px 1px 3px;border-radius:4px;background:var(--cream2);display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;color:var(--tdark)}
.cost span.no{background:#f7d2c9;color:#9b2c1f}
.hearts{display:flex;gap:2px;margin-top:2px}
.hearts i{width:12px;height:10px;background:#d8c6b0;clip-path:polygon(0 20%,20% 0,40% 0,50% 15%,60% 0,80% 0,100% 20%,100% 50%,50% 100%,0 50%)}
.hearts i.on{background:#e8405a}
.hearts.rival i.on{background:var(--orange)}
.hearts.mentor i.on{background:var(--gold)}
.portrait{width:57px;height:57px;flex:none;border-radius:4px;background:#121a17;box-shadow:0 0 0 2px var(--teal),0 0 0 4px var(--ink);image-rendering:pixelated;margin:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.item{background:var(--paper);border-radius:6px;box-shadow:0 0 0 2px var(--cream3);padding:6px 8px;display:flex;gap:7px;align-items:center;min-width:0}
.item .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.2}
.item .ct{font-family:var(--f-pix);font-weight:700;font-variant-numeric:tabular-nums;color:var(--wood)}
.item.tap{cursor:pointer;color:var(--tdark);font:inherit;border:0;width:100%}
.aff{font-size:12.5px;color:var(--violet)}
.rar0{color:var(--tdark)}.rar1{color:#2f7fd1}.rar2{color:#8b4fd8}.rar3{color:#d27a00}.rar4{color:#d6336c;text-shadow:0 0 6px rgba(255,120,170,.45)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.xpbar{height:10px;border-radius:5px;background:var(--cream2);box-shadow:0 0 0 2px var(--ink);overflow:hidden;margin-top:8px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8b5fd0,#c99aff)}
.sktree{display:flex;flex-direction:column;gap:12px;position:relative}
.sknode{position:relative;display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:6px;box-shadow:0 0 0 2px var(--ink),inset 4px 0 0 var(--bc);padding:8px 10px 8px 12px}
.sknode .body{flex:1;min-width:0}.sknode .name{font-family:var(--f-pix);font-weight:600;font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sknode.lock{opacity:.6;filter:saturate(.5)}.sknode.own{box-shadow:0 0 0 2px var(--ink),inset 4px 0 0 var(--bc),0 0 0 4px color-mix(in srgb,var(--bc) 35%,transparent)}
.sknode .skline{position:absolute;left:26px;top:-14px;width:3px;height:14px;background:var(--bc);opacity:.7}
.sknode .pkic .ico.s{margin:3px}

const LINES={
 tobias:[["El hierro no miente: si lo calientas mal, se rompe. Como las personas.","¿Ya has probado esa honda? Rosa la usaba para espantar cuervos... y alcaldes.","La forja está abierta. Tú traes materiales, yo pongo el fuego."],["Desde que limpias las grietas, el carbón arde mejor. No sé explicarlo.","Rosa hablaba de ti en sus cartas. Decía que no te rendías nunca.","Si un arma te pesa, no es tu arma. Prueba otra."],["Ya eres mi aprendiz, aunque no lo digamos en voz alta.","Cuando esto acabe forjaremos una veleta para tu tejado. Con forma de nabo.","El valle suena distinto. A martillo y a risa."]],
 nilo:[["¿Es verdad que luchas con bichos de las grietas? ¿Son más grandes que una vaca?","Mi madre dice que no me acerque a la Marchitez. Yo solo la miro un poquito.","Tengo una colección de piedras. Esta es la mejor. Se llama Piedra."],["¡Hoy he regado sin mojarme los zapatos! Bueno, uno.","Cuando sea mayor tendré un gólem. Se llamará Piedra Dos.","Darío dice que dibujo los mapas al revés. Pero se entienden."],["Eres mi persona favorita después de mi madre. Empatada con Piedra.","¡Ya distingo un tomate maduro solo oliéndolo!","Quiero una granja como la tuya. Pero con más gallinas."]],
 dario:[["Este mapa tenía cuarenta caminos. Ahora tiene once. La Marchitez se come los bordes.","Si ves una piedra con una flecha tallada, es mía. No la muevas.","¿Sabes leer un mapa? Da igual, te lo explico. Me encanta explicarlo."],["He añadido tu granja al mapa con tinta verde. Es la única.","Las grietas cambian de forma cada noche. Por eso nadie las ha cartografiado. Todavía.","Te traje una piedra con forma de patata. Me acordé de ti."],["Llevo años mirando lejos. Últimamente prefiero mirar aquí.","Mi próximo mapa tendrá un camino solo para ir a tu casa.","Si alguna vez me pierdo, ya sé dónde buscarme."]],
 eira:[["...","El viento de la cumbre trae ceniza. Antes traía polen.","No te acerques demasiado. Lo gris se pega."],["Tu granja huele a la de Rosa.","Riegas con demasiado cuidado. Ella también lo hacía.","A veces la tierra no es mala. Solo está cansada."],["Gracias por venir, aunque yo no lo pida.","Te oigo cantar cuando cultivas. No creas que no se oye desde aquí.","Rosa estaría orgullosa. Yo lo estoy, si me dejas."]],
 lia:[["Perdona, estoy contando esporas. Llevo 2.341... ¿o 2.314?","El musgo crece hacia donde hay agua. Las personas también, creo.","¿Tus nabos tienen manchas grises? Tráemelos si pasa."],["Te he guardado un esqueje de manzanilla. Huele a casa.","He empezado a dibujar tu huerto en mi cuaderno. Para estudiarlo. Solo para eso.","Las abejas han vuelto a la plaza. Tres. Las conté dos veces."],["Cuando entras por la puerta se me olvida el nombre latino de todo.","¿Paseamos luego por tu huerto? Quiero ver cómo duermen las plantas.","Contigo, el valle parece un sitio donde quedarse."]],
 vera:[["¿Eso es un nabo o una piedra pintada?","Mi granja produjo el doble que la tuya ayer. Y anteayer.","La feria es al final de la estación. Ve preparando tu cara de derrota."],["Tus tomates no están mal. No te lo creas mucho.","He visto que limpiaste la zarza del lindero. Hm. Bien.","Mi padre nunca me dejó ganar ni al parchís. Por eso ahora gano yo."],["Si necesitas semillas, pídemelas. Pero que no se entere nadie.","Competir contigo es lo más divertido que me ha pasado en diez años.","El año que viene te gano por el doble. Ya verás."]],
};

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function silhouette(im,col){if(!im)return null;const c=mkCanvas(im.width,im.height),g=c.getContext('2d');g.drawImage(im,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return c;}
function recolor(im,sx,sy,w,h,fn){const c=mkCanvas(w,h),g=c.getContext('2d');g.drawImage(im,sx,sy,w,h,0,0,w,h);const d=g.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){if(!a[i+3])continue;const r=fn(a[i],a[i+1],a[i+2]);a[i]=r[0];a[i+1]=r[1];a[i+2]=r[2];}g.putImageData(d,0,0);return c;}
function buildDerived(){
 for(const k in IMG){if(k.startsWith('m_')||k.startsWith('b_')||k.startsWith('c_'))DER['W'+k]=silhouette(IMG[k],'#ffffff');if(k.startsWith('m_'))DER['G'+k]=silhouette(IMG[k],'#ffd23f');}
 const t=IMG.terrain_spring;
 if(t){DER.pondDry=recolor(t,0,29*16,48,48,(r,g,b)=>b>r+30&&b>g-10?(r+g+b>560?[205,180,140]:[150,112,78]):[r,g,b]);}
 if(IMG.w_leaf)DER.leafAut=recolor(IMG.w_leaf,0,0,72,7,(r,g,b)=>{const l=r*.3+g*.59+b*.11;return[Math.min(255,l*1.2+80),Math.min(255,l*.75+28),l*.25+12];});
 const n=IMG.nature;
 if(n){const grey=(r,g,b)=>{const l=(r*.3+g*.59+b*.11);return[l*.62+40,l*.55+34,l*.72+44];};for(const k of ['bush1','bush2','bush3']){const s=SPR[k];DER['dead_'+k]=recolor(n,s[1],s[2],s[3],s[4],grey);}}
}

const cv=$('#cv'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas'),bx=buf.getContext('2d');
let HUD_T=0,HUD_B=0;
function measureHud(){if(scene!=='world'){HUD_T=HUD_B=0;return;}if(CINE.on){HUD_T=HUD_B=Math.round(innerHeight*.09);return;}const o=$('#obj'),top=(o&&!o.hidden?o:$('#hud')).getBoundingClientRect().bottom,act=$('#act'),ctrl=$('#ctrl');HUD_T=Math.max(0,top+6);HUD_B=ctrl&&!ctrl.hidden&&act?Math.max(0,innerHeight-act.getBoundingClientRect().top+4):0;}
const LW=360;let LH=640,VW=360,OX=0,DPR=1,PS=2,BW=180,BH=320,PX=1,K=1,SAFE_T=0,SAFE_B=0,CX=0,CY=0;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);const W=innerWidth,H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 PS=Math.max(1,Math.floor(Math.min(cv.width/184,cv.height/260)));BW=Math.ceil(cv.width/PS);BH=Math.ceil(cv.height/PS);buf.width=BW;buf.height=BH;bx.imageSmoothingEnabled=false;
 VW=BW*2;LH=BH*2;OX=(VW-LW)/2;PX=PS/DPR;K=2/PX;
 const cs=getComputedStyle($('#safe'));SAFE_T=(parseFloat(cs.paddingTop)||0)*K;SAFE_B=(parseFloat(cs.paddingBottom)||0)*K;if(typeof scene!=='undefined')measureHud();}

/* ================= PIXEL PRIMITIVES (buffer, art px) ================= */
const P2=v=>Math.round(v/2);
function rect(c,x,y,w,h){bx.fillStyle=c;bx.fillRect(Math.round(x),Math.round(y),w,h);}
function blit(im,sx,sy,sw,sh,dx,dy,flip){if(!im)return;dx=Math.round(dx);dy=Math.round(dy);if(flip){bx.save();bx.translate(dx+sw,dy);bx.scale(-1,1);bx.drawImage(im,sx,sy,sw,sh,0,0,sw,sh);bx.restore();}else bx.drawImage(im,sx,sy,sw,sh,dx,dy,sw,sh);}
function natSheet(){const se=S?season():0;return se===1?IMG.nature_summer:se===2?IMG.nature_autumn:IMG.nature;}
function sprite(name,ax,ay,o={}){const s=SPR[name];if(!s)return;let im=o.im||(s[0]==='N'?(o.base?IMG.nature:natSheet()):IMG[SHEETK[s[0]]]);if(o.alpha!=null)bx.globalAlpha=o.alpha;blit(im,s[1],s[2],s[3],s[4],ax-Math.floor(s[3]/2),ay-s[4],o.flip);if(o.alpha!=null)bx.globalAlpha=1;}
function shadowAt(ax,ay,w=12,al=1){const im=IMG.shadow;if(!im)return;const ga=bx.globalAlpha;bx.globalAlpha=ga*.3*al;if(w===12)bx.drawImage(im,Math.round(ax-6),Math.round(ay-4));else{const h=Math.max(3,Math.round(w*.4));bx.drawImage(im,0,0,12,7,Math.round(ax-w/2),Math.round(ay-h*.6),w,h);}bx.globalAlpha=ga;}
function pxDisk(cx,cy,r,c){bx.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));bx.fillRect(cx-w,cy+y,w*2+1,1);}}
function pxRing(cx,cy,r,c){bx.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);let px=-1;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));bx.fillRect(cx-w,cy+y,1,1);bx.fillRect(cx+w,cy+y,1,1);}for(let x=-r;x<=r;x++){const h=Math.round(Math.sqrt(Math.max(0,r*r-x*x)));bx.fillRect(cx+x,cy-h,1,1);bx.fillRect(cx+x,cy+h,1,1);}}
function icon(k,ax,ay){const p=ICONS[k];if(!p||!IMG.icons)return;blit(IMG.icons,p[0]*16,p[1]*16,16,16,ax-8,ay-16);}
function rotBlit(im,sx,sy,sw,sh,cx,cy,ang){if(!im)return;const a=Math.round(ang/(Math.PI/8))*(Math.PI/8);bx.save();bx.translate(Math.round(cx),Math.round(cy));bx.rotate(a);bx.drawImage(im,sx,sy,sw,sh,-Math.round(sw/2),-Math.round(sh/2),sw,sh);bx.restore();}
/* character sheets: 4 columns (down, up, left, right) x rows (walk frames, then attack) */
function drawChar(key,wx,wy,dir,face,walk,moving,o={}){const im=IMG['c_'+key];if(!im)return;const col=dir==='down'?0:dir==='up'?1:(face<0?2:3);const rows=im.height/16;
 let row=0;if(o.attack&&rows>4)row=4;else if(moving)row=rows>=4?Math.floor(walk/1.55)%4:Math.floor(walk/2.2)%2;
 let c2=col;if(o.pose&&rows>o.pose[1]){c2=o.pose[0];row=o.pose[1];}
 const ax=P2(wx),ay=P2(wy);if(!o.noShadow)shadowAt(ax,ay);if(o.alpha!=null)bx.globalAlpha=o.alpha;bx.drawImage(o.flash?DER['Wc_'+key]:im,c2*16,row*16,16,16,ax-8,ay-15,16,16);bx.globalAlpha=1;}
function faceSrc(who){const k=CAST[who];return k?asrc('f_'+k):null;}
const OVL=[];
function label(ax,ay,t,o={}){OVL.push({x:ax,y:ay,t,c:o.c||'#fff6dc',s:o.s||13,w:o.w||600,a:o.a==null?1:o.a,bg:o.bg});}
function drawOverlay(g){g.textAlign='center';g.textBaseline='alphabetic';for(const l of OVL){const x=(l.x-CX)*PX,y=(l.y-CY)*PX;g.globalAlpha=l.a;g.font=`${l.w} ${l.s}px 'RDig','Pixelify Sans',sans-serif`;
 if(l.bg){const tw=g.measureText(l.t).width+12,h=l.s+8;g.fillStyle='#131b1b';g.fillRect(Math.round(x-tw/2)-2,Math.round(y-h+3)-2,Math.round(tw)+4,h+4);g.fillStyle=l.bg;g.fillRect(Math.round(x-tw/2),Math.round(y-h+3),Math.round(tw),h);g.fillStyle=l.c;g.fillText(l.t,x,y-2);}
 else{g.lineJoin='round';g.lineWidth=Math.max(3,l.s*.28);g.strokeStyle='rgba(19,27,27,.92)';g.strokeText(l.t,x,y);g.fillStyle=l.c;g.fillText(l.t,x,y);}}g.globalAlpha=1;}

const ICSZ={s:16,'':24,l:32,xl:64};
function icHTML(k,sz=''){const p=ICONS[k],n=ICSZ[sz]||24;return p?`<i class="ico ${sz}" style="background-position:${-p[0]*n}px ${-p[1]*n}px"></i>`:'';}

function setIco(el,k){const p=ICONS[k];if(!p)return;const n=el.classList.contains('s')?16:el.classList.contains('l')?32:el.classList.contains('xl')?64:24;el.style.backgroundPosition=`${-p[0]*n}px ${-p[1]*n}px`;}

function costHTML(req={},gold=0,ess=0){let h='';if(gold)h+=`<span class="${S.gold<gold?'no':''}">${ic('coin','s')}${gold}</span>`;if(ess)h+=`<span class="${S.esencia<ess?'no':''}"><i class="ess"></i>${ess}</span>`;for(const k in req)h+=`<span class="${inv(k)<req[k]?'no':''}">${ic(k,'s')}${ITEMS[k].n} ${inv(k)}/${req[k]}</span>`;return `<div class="cost">${h}</div>`;}

let dq=[],curLine=null,typing=null,curFull='';
function say(lines,cb){for(const l of lines)dq.push(typeof l==='string'?{who:'narr',t:l}:l);if(cb)dq.push({cb});if($('#dlg').hidden)nextLine();}
function fmt(t){return t.replace(/\{name\}/g,S?S.name:'');}
function nextLine(){
 while(dq.length&&dq[0].cb){const f=dq.shift().cb;f();}
 if(!dq.length){$('#dlg').hidden=true;curLine=null;refreshAll();return;}
 const l=dq.shift();if(l.fn)l.fn();curLine=l;const d=$('#dlg');d.hidden=false;
 const who=l.who||'narr',por=$('#dpor');
 if(who==='narr'){por.hidden=true;$('#dname').textContent='';}
 else{por.hidden=false;por.innerHTML=who==='rosa'?icHTML('letter','xl'):`<img src="${faceSrc(who)}" alt="">`;$('#dname').textContent=who==='rosa'?'Carta de Rosa':who==='yo'?S.name:who==='pia'?'Pía':AMB[who]?AMB[who].n:npcName(who);const v=VOICE[who];if(v)snd('v'+v[0],1,v[1]);}
 $('#dchoices').innerHTML='';$('#dnext').hidden=true;
 curFull=fmt(l.t);const tx=$('#dtext');tx.textContent='';tx.className=who==='narr'||who==='rosa'?'narr':'';
 let i=0;clearInterval(typing);typing=setInterval(()=>{i+=2;tx.textContent=curFull.slice(0,i);if(i>=curFull.length)finishType();},16);}
function finishType(){clearInterval(typing);typing=null;$('#dtext').textContent=curFull;if(curLine&&curLine.choices){$('#dchoices').innerHTML=curLine.choices.map((c,i)=>`<button class="btn alt" data-a="choice" data-v="${i}">${esc(c.t)}</button>`).join('');}else $('#dnext').hidden=false;}
$('#dlg').addEventListener('click',e=>{if(e.target.closest('[data-a]'))return;if(typing){finishType();return;}if(curLine&&curLine.choices)return;snd('menu',.6);nextLine();});
ACT.choice=v=>{const c=curLine.choices[+v];curLine=null;const pending=dq.splice(0);if(c.fn)c.fn();dq.push(...pending);nextLine();};

function objective(){
 const c=CH[S.ch];
 if(S.ch===0)return{t:'Prólogo',d:`Cosecha 5 cultivos (${Math.min(5,S.stats.harvest)}/5). Ponte frente a una casilla del huerto y pulsa el botón redondo.`};
 if(S.stage==='post')return{t:'Abismo',d:`Récord: piso ${S.abyss.best}. Entra por la grieta del norte de tu granja.`};
 const roman=c.t.split(' · ')[0];
 if(S.stage==='prep'){const ok=c.prep(),prog=c.take?' ('+Object.keys(c.take).map(k=>`${ITEMS[k].n.toLowerCase()} ${Math.min(inv(k),c.take[k])}/${c.take[k]}`).join(', ')+')':'';return{t:roman,d:ok?`${c.prepTxt}. ¡Lo tienes! Ve a hablar con ${NPCS[c.who].n}.`:c.prepTxt+prog+'.',ready:ok};}
 const r=REGIONS.find(r=>r.ch===S.ch);return{t:roman,d:`Derrota a ${BOSS[r.boss].n} en ${REG[r.id].n}. Entra por la grieta al norte de tu granja.`};}
function availableSeeds(){const se=season(),gh=S.farm.deco.invernadero;return Object.keys(CROPS).filter(k=>(!CROPS[k].req||CROPS[k].req())&&(gh||CROPS[k].se.includes(se)));}
function renderHotbar(){if(!S)return;const seeds=availableSeeds();if(MODE.type==='seed'&&!seeds.includes(MODE.id))MODE={type:'auto'};if(MODE.type==='place'&&!inv(MODE.id))MODE={type:'auto'};if(MODE.type==='pick'&&!placedN())MODE={type:'auto'};
 const B=(on,v,icon,n,sub)=>`<button class="seed ${on?'on':''}" data-a="mode" data-v="${v}">${ic(icon)}<span>${n.replace(/\S{11,}/g,w=>w.slice(0,7)+'&shy;'+w.slice(7))}</span><small>${sub}</small></button>`;
 let h=B(MODE.type==='auto','auto','t_hoe','Manos','sin plantar');
 const pl=(S.farm.vo||[])[0];if(pl)h+=B(MODE.type==='pick','pick',pl.o,'Recoger','artefactos');
 if(seeds.length){h+='<h4>Semillas</h4>';for(const k of seeds)h+=B(MODE.type==='seed'&&MODE.id===k,'seed:'+k,k,CROPS[k].n,CROPS[k].seed+' oro');}

function sheetMercado(){
 let h=sheetHead('Mercado de Pía','Vende tu cosecha, compra lo básico y encarga mejoras para la granja.');
 h+='<h3>Vender</h3>';const sell=Object.keys(S.inv).filter(k=>ITEMS[k]&&ITEMS[k].p>0&&inv(k)>0);
 if(!sell.length)h+='<p class="sub">No tienes nada que vender. Cosecha o baja a una grieta.</p>';
 else{const crops=sell.filter(k=>ITEMS[k].k==='crop');if(crops.length){const tot=crops.reduce((a,k)=>a+ITEMS[k].p*inv(k),0);h+=`<div class="row" style="margin-bottom:8px"><button class="btn" data-a="sellcrops">Vender toda la cosecha (+${tot})</button></div>`;}

 h+='<h3>Comprar</h3><div class="list">';
 for(const s of SHOP){if(!s.req())continue;h+=`<div class="item">${ic(s.id)}<span class="nm">${ITEMS[s.id].n}${s.id==='ramo'?'<br><span class="sub">Regálalo con 8 corazones para empezar una relación.</span>':s.id==='colgante'?'<br><span class="sub">Una propuesta para toda la vida.</span>':''}</span><button class="btn alt sm" data-a="buy" data-v="${s.id}" ${S.gold<s.gold?'disabled':''}>${s.gold}</button></div>`;}

 return h+'</div>';}

function sheetGrieta(){
 let h=sheetHead('La grieta','Cada bajada cuesta 20 de energía. Si caes, conservas la mitad del botín.');
 if(S.buff)h+=`<div class="card"><div class="body"><div class="name">Plato preparado</div><p class="sub">${ITEMS[S.buff.id].n}: ${BUFFS[S.buff.b]}</p></div></div>`;
 h+='<h3>Historia</h3><div class="list">';let any=false;
 for(const r of REGIONS){const un=S.bossDone[r.boss]||(S.ch===r.ch&&S.stage==='rift');if(!un)continue;any=true;const done=S.bossDone[r.boss];

 if(!any)h+='<p class="sub">La grieta todavía está cerrada. Sigue el objetivo de arriba.</p>';

const wmLvl=()=>(S&&S.wm)||0;

function maxLvl(){return S.flags.post?999:5+(S.flags.tob6?10:0)+(S.bossDone.lodo?5:0);}
function upCost(){const l=wmLvl();if(S.flags.post&&l>=15)return{gold:Math.round(150*(l+1)),ess:Math.round(6*Math.pow(1.16,l-14)),in:{}};
 const m=S.flags.tob3?.8:1;const gold=Math.round(60*Math.pow(l+1,1.6)*m);let req;if(l<5)req={piedra:5+l*2,madera:5};else if(l<10)req={cobre:2+(l-5)*2};else if(l<15)req={hierro:2+(l-10)*2,brasa:1+(l-10)};else req={escama:2+(l-15),ceniza:2+(l-15)};return{gold,in:req,ess:0};}

function talk(id){const n=S.npc[id];const np=NP[id];if(np){np.face=P.x<np.x?-1:1;np.dir=Math.abs(P.x-np.x)>Math.abs(P.y-np.y)?'side':P.y<np.y?'up':'down';np.wait=3;}
 if(S.stage==='prep'&&CH[S.ch]&&CH[S.ch].who===id&&CH[S.ch].prep()){if(n.t!==S.day){n.t=S.day;addP(id,4);}deliver();return;}
 let lines;
 if(n.t!==S.day){n.t=S.day;addP(id,4);const h=hearts(id);for(const th of [3,6,9]){if(h>=th&&!S.flags[id+th]&&HEV[id][th]){S.flags[id+th]=1;lines=HEV[id][th]();break;}}
  if(!lines){const L=LINES[id][h<4?0:h<8?1:2];lines=[{who:id,t:L[(S.day+id.length)%L.length]}];}}
 else lines=[{who:id,t:AGAIN[id]}];
 const last=lines[lines.length-1];
 if(n.g!==S.day&&!last.choices)last.choices=[{t:'Hacer un regalo',fn:()=>giftMenu(id)},{t:'Adiós',fn:null}];
 say(lines,()=>save());refreshAll();}

ACT.give=v=>{const[id,k]=v.split(':');closeOv();const n=S.npc[id],N=NPCS[id];if(n.g===S.day)return;
 if(k==='ramo'){if(N.kind!=='romance'){addI(k,-1);n.g=S.day;addP(id,6);say([{who:id,t:'¡Qué flores tan bonitas! Gracias.'}]);}
  else if(S.partner&&S.partner!==id)say([{who:id,t:'Creo que tu corazón ya tiene dueño. Pero gracias.'}]);
  else if(hearts(id)<8)say([{who:id,t:'Es precioso... pero quizá es pronto para esto.'}]);
  else{addI(k,-1);n.g=S.day;S.partner=id;addP(id,15);say(id==='lia'?[{who:'lia',t:'¿Es para mí? ¿En ese sentido?'},{who:'lia',t:'Sí. Sí, claro que sí. Voy a necesitar un cuaderno nuevo solo para esto.'},{who:'narr',t:'Lía y tú sois pareja.'}]:[{who:'dario',t:'Vaya. Esto no venía en ningún mapa.'},{who:'dario',t:'Me encantaría perderme contigo. Bueno, no perderme. Ya me entiendes.'},{who:'narr',t:'Darío y tú sois pareja.'}]);}
  refreshAll();save();return;}
 if(k==='colgante'){if(S.partner===id&&hearts(id)>=10&&S.flags.post){addI(k,-1);n.g=S.day;S.married=true;say([{who:id,t:'¿Un colgante de raíz? En el valle eso significa...'},{who:id,t:'Sí. Mil veces sí.'},{who:'narr',t:'Una semana después, la boda se celebra en tu huerto. Vera llora. Lo niega.'},{who:'narr',t:`${N.n} se muda a tu granja y te ayudará a regar cada mañana.`}],()=>placeNPCs());}
  else say([{who:id,t:'Es muy bonito, pero no creo que sea para mí... todavía.'}]);refreshAll();save();return;}
 addI(k,-1);n.g=S.day;let r,t;
 if(N.love.includes(k)){r=20;t=pick(['¡Me encanta! ¿Cómo lo sabías?','Esto es justo lo que necesitaba.','No sé qué decir. Gracias de verdad.']);}
 else if(N.like.includes(k)){r=10;t=pick(['¡Gracias! Me gusta mucho.','Qué detalle.','Esto me viene genial.']);}
 else if(N.hate.includes(k)){r=-10;t=pick(['Eh... gracias, supongo.','¿Esto es una broma?','Prefiero no tocarlo, si no te importa.']);}

/* ================= CINEMATICS ================= */
/* cine([...steps], done): a queue of scripted steps run on the world maps. Positions are in tiles.
   steps: {a:id,k:'Vampire',at:[x,y],dir,f} add actor · {rm:id} · {mv:id,to:[x,y],spd,nowait} walk ('P' = player)
   {dir:id,d,f} · {cam:[x,y]|id|'P',spd,nowait} · {wait:s} · {say:[...]} · {fn} · {tp:[map,x,y,dx,dy]} fade + teleport
   {emote:id,e:'!'} · {tw:id,p:{al,z,sc},t} tween · {fx:'flash'|'shake'|'burst',...} · {fade:1|0} · {sfx:k} */
const CINE={on:false,q:[],cur:null,actors:{},cam:null,camPos:null,skip:false,flash:0,emotes:[],fx:[],dark:0,name:''};
function cine(steps,done,name){if(CINE.on){CINE.q.push(...steps);if(done)CINE.q.push({fn:done});return;}
 Object.assign(CINE,{on:true,q:steps.slice(),cur:null,actors:{},cam:null,camPos:{x:P.x,y:P.y},skip:false,flash:0,emotes:[],fx:[],dark:0,name:name||''});if(done)CINE.q.push({fn:done});
 joy=null;actHeld=false;stroke=null;keys={};if(curTab)closeSheet();if(typeof bagOpen==='function')bagOpen(false);closeOv();$('#app').classList.add('cine');measureHud();}
function cineEnd(){CINE.on=false;CINE.actors={};CINE.camPos=null;CINE.cam=null;CINE.dark=0;CINE.fx=[];CINE.emotes=[];$('#app').classList.remove('cine');$('#fade').classList.remove('on');fading=false;refreshAll();save();}
function cineSkip(){if(!CINE.on||CINE.skip)return;CINE.skip=true;dq.length=0;clearInterval(typing);typing=null;curLine=null;$('#dlg').hidden=true;snd('menu',.6);}
const cineFocus=()=>CINE.on&&CINE.camPos?CINE.camPos:P;
const tl=v=>v*TS;
function cineActor(id){return id==='P'?P:CINE.actors[id]||NP[id];}
function cineStart(s){const st={s,t:0};
 if(s.a){CINE.actors[s.a]={id:s.a,k:s.k,x:tl(s.at[0]),y:tl(s.at[1]),dir:s.dir||'down',face:s.f||1,walk:0,moving:false,al:s.al==null?1:s.al,z:0,sc:1,draw:s.draw||null,ns:s.ns};st.done=true;}
 else if(s.rm){delete CINE.actors[s.rm];st.done=true;}
 else if(s.dir){const A=cineActor(s.dir);if(A){if(s.dir==='P'){P.dx=s.d==='side'?(s.f||1):0;P.dy=s.d==='up'?-1:s.d==='down'?1:0;if(s.f)P.face=s.f;}else{A.dir=s.d;if(s.f)A.face=s.f;}}st.done=true;}
 else if(s.mv){const A=cineActor(s.mv);st.A=A;st.tx=tl(s.to[0]);st.ty=tl(s.to[1]);if(!A)st.done=true;else if(s.nowait){CINE.fx.push({mv:st,spd:s.spd||62});st.done=true;}}
 else if(s.cam){st.done=!!s.nowait;CINE.cam={tg:s.cam,spd:s.spd||3};}
 else if(s.say){if(CINE.skip)st.done=true;else say(s.say,()=>{st.done=true;});}
 else if(s.fn){s.fn();st.done=true;}
 else if(s.emote){const A=cineActor(s.emote);if(A&&!CINE.skip)CINE.emotes.push({A,e:s.e,t:0,life:s.life||1.3});if(s.sfx!==false&&!CINE.skip)snd(s.e==='!'?'pick':'menu',.7);st.done=true;}
 else if(s.tw){st.A=cineActor(s.tw);st.from={};if(st.A)for(const k in s.p)st.from[k]=st.A[k]==null?(k==='al'||k==='sc'?1:0):st.A[k];else st.done=true;}
 else if(s.fx){if(!CINE.skip||s.fx==='shake')cineFx(s);st.done=true;}
 else if(s.sfx){if(!CINE.skip)snd(s.sfx,s.v||1,s.r||1);st.done=true;}
 else if(s.fade!=null){$('#fade').classList.toggle('on',!!s.fade);st.dur=CINE.skip?0:.4;}
 else if(s.tp){$('#fade').classList.add('on');st.dur=CINE.skip?0:.4;st.mid=true;}
 else if(s.wait!=null){st.dur=s.wait;}
 else st.done=true;
 return st;}
function moveActor(A,tx,ty,step,dt){const dx=tx-A.x,dy=ty-A.y,d=Math.hypot(dx,dy);if(d<=step||d<.5){A.x=tx;A.y=ty;A.moving=false;return true;}
 A.x+=dx/d*step;A.y+=dy/d*step;A.walk=(A.walk||0)+dt*10;A.moving=true;
 if(A===P){if(Math.abs(dx)>Math.abs(dy)){P.dx=Math.sign(dx);P.dy=0;P.face=P.dx;}else{P.dx=0;P.dy=Math.sign(dy);}}
 else if(Math.abs(dx)>Math.abs(dy)){A.dir='side';A.face=dx<0?-1:1;}else A.dir=dy<0?'up':'down';return false;}
function cineStep(st,dt){const s=st.s;if(st.done)return true;st.t+=dt;
 if(s.mv){if(CINE.skip){st.A.x=st.tx;st.A.y=st.ty;st.A.moving=false;return true;}return moveActor(st.A,st.tx,st.ty,(s.spd||62)*dt,dt);}
 if(s.cam){if(CINE.skip||!CINE.cam)return true;const g=camGoal();return dist(CINE.camPos.x,CINE.camPos.y,g.x,g.y)<6;}
 if(s.say){if(CINE.skip){return true;}return false;}
 if(s.tw){const k=CINE.skip?1:Math.min(1,st.t/(s.t||.5)),e=k*k*(3-2*k);for(const p in s.p)st.A[p]=st.from[p]+(s.p[p]-st.from[p])*e;return k>=1;}
 if(s.tp){if(st.mid&&(CINE.skip||st.t>=st.dur)){st.mid=false;const[m,x,y,dx,dy]=s.tp;P.map=m;P.x=tl(x);P.y=tl(y);P.dx=dx||0;P.dy=dy==null?1:dy;P.anim=null;POPS=[];CINE.camPos={x:P.x,y:P.y};CINE.cam=null;if(typeof petTo==='function')petTo();updCam(1,true);updHotbarVis();$('#fade').classList.remove('on');st.t=0;return CINE.skip;}return !st.mid&&(CINE.skip||st.t>=st.dur);}
 if(st.dur!=null)return CINE.skip||st.t>=st.dur;
 return true;}
function camGoal(){const c=CINE.cam&&CINE.cam.tg;if(!c)return CINE.camPos;if(c==='P')return P;if(typeof c==='string'){const A=cineActor(c);return A?{x:A.x,y:A.y}:P;}return{x:tl(c[0]),y:tl(c[1])};}
function updCine(dt){if(!CINE.on)return;
 for(let g=0;g<60;g++){if(!CINE.cur){if(!CINE.q.length){if(!CINE.fx.some(f=>f.mv)){cineEnd();return;}break;}CINE.cur=cineStart(CINE.q.shift());if(!CINE.on)return;}
  if(cineStep(CINE.cur,CINE.skip?0:dt)){CINE.cur=null;if(!CINE.skip)dt=0;continue;}break;}
 for(const f of CINE.fx)if(f.mv&&!f.done){const st=f.mv;if(CINE.skip||moveActor(st.A,st.tx,st.ty,f.spd*dt,dt)){st.A.x=st.tx;st.A.y=st.ty;st.A.moving=false;f.done=true;}}
 CINE.fx=CINE.fx.filter(f=>!f.done&&(f.mv||(f.life-=dt)>0));
 if(CINE.cam){const g=camGoal(),k=CINE.skip?1:Math.min(1,dt*CINE.cam.spd);CINE.camPos={x:CINE.camPos.x+(g.x-CINE.camPos.x)*k,y:CINE.camPos.y+(g.y-CINE.camPos.y)*k};}
 for(const e of CINE.emotes)e.t+=dt;CINE.emotes=CINE.emotes.filter(e=>e.t<e.life);
 CINE.flash=Math.max(0,CINE.flash-dt*1.6);if(shake>0)shake=Math.max(0,shake-dt*14);
 if(P.moving===false&&CINE.fx.some(f=>f.mv&&f.mv.A===P))P.moving=true;
 const cur=CINE.cur&&CINE.cur.s;if(cur&&cur.mv==='P'&&!CINE.cur.done)P.moving=true;}
function cineFx(s){const at=s.at?{x:tl(s.at[0]),y:tl(s.at[1])}:P;
 if(s.fx==='flash'){CINE.flash=s.amp||1;if(s.c)CINE.flashC=s.c;else CINE.flashC='#ffffff';}
 else if(s.fx==='shake'){shake=s.amp||8;}
 else if(s.fx==='burst'){const c=s.c||['#b28cff','#e6d6ff','#ffffff'];for(let i=0;i<(s.n||26);i++){const a=rnd(0,6.28),v=rnd(30,s.v||130);FP.push({x:at.x,y:at.y-(s.h||10),vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rnd(.5,1.1),c:pick(c)});}}
 else if(s.fx==='coins'){for(let i=0;i<(s.n||14);i++){const a=rnd(-2.6,-.5),v=rnd(60,140);FP.push({x:at.x,y:at.y-14,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.6,1),c:pick(['#ffd75e','#f2b632','#fff3b0'])});}snd('coin');}
 else if(s.fx==='ring'){CINE.fx.push({ring:1,x:at.x,y:at.y,life:s.life||1,max:s.life||1,c:s.c||'#b28cff',r:s.r||60});}
 else if(s.fx==='beam'){CINE.fx.push({beam:1,x:at.x,y:at.y,life:s.life||1.4,max:s.life||1.4,c:s.c||'#b28cff'});}}
/* ---- drawing (inside drawWorld's sorted list) ---- */
function drawCineActors(add,vis){if(!CINE.on)return;

  add(A.y+(A.zs||0),()=>{if(A.draw){A.draw(A,ax,ay);return;}
   if(A.sc!==1||A.z){const im=IMG['c_'+A.k];if(!im)return;const col=A.dir==='down'?0:A.dir==='up'?1:(A.face<0?2:3),row=A.moving?Math.floor(A.walk/1.55)%4:0,w=Math.round(16*A.sc);if(!A.ns)shadowAt(ax,ay,Math.round(12*A.sc),A.al);bx.globalAlpha=A.al;bx.drawImage(im,col*16,row*16,16,16,Math.round(ax-w/2),Math.round(ay-15*A.sc+A.z),w,w);bx.globalAlpha=1;return;}
   drawChar(A.k,A.x,A.y,A.dir,A.face,A.walk,A.moving,{alpha:A.al,noShadow:A.ns});});}
 add(1e8,drawCineFx);}
function drawCineFx(){for(const f of CINE.fx){if(f.ring){const k=1-f.life/f.max,r=Math.round(P2(f.r)*k);bx.globalAlpha=(1-k)*.8;bx.strokeStyle=f.c;bx.lineWidth=2;bx.beginPath();bx.ellipse(P2(f.x),P2(f.y),r+1,(r+1)*.55,0,0,7);bx.stroke();bx.globalAlpha=1;}
  if(f.beam){const k=f.life/f.max,w=Math.round(10*Math.min(1,k*2)),x=P2(f.x),y=P2(f.y);bx.globalAlpha=.55*Math.min(1,k*2);rect(f.c,x-w/2,y-220,w,220);bx.globalAlpha=.9*Math.min(1,k*2);rect('#ffffff',x-Math.max(1,w/4),y-220,Math.max(2,w/2),220);bx.globalAlpha=1;}}
 for(const e of CINE.emotes){const A=e.A,ax=P2(A.x),ay=P2(A.y)-22-Math.round(Math.min(1,e.t*8)*2)+(A.z||0)/2;rect('#131b1b',ax-5,ay-9,11,10);rect('#fffaf2',ax-4,ay-8,9,8);rect('#131b1b',ax-1,ay+1,2,2);
  const c=e.e==='!'?'#e8405a':e.e==='♥'?'#ff6f91':'#3a2621';label(ax+.5,ay-1,e.e,{s:e.e.length>1?9:11,c,w:700});}}
function drawCineOverlay(){if(!CINE.on)return;if(CINE.dark>0){bx.fillStyle=`rgba(12,10,30,${CINE.dark})`;bx.fillRect(0,0,BW,BH);}
 if(CINE.flash>0){bx.globalAlpha=Math.min(1,CINE.flash);bx.fillStyle=CINE.flashC||'#fff';bx.fillRect(0,0,BW,BH);bx.globalAlpha=1;}}

Object.assign(LINES,{
 cardo:[["Vera dice que la feria de este año la gana ella. Ya veremos.","No me mires así. Estoy aprendiendo a pedir perdón. Despacio.","Tus tomates están bien. Les falta paciencia. Como a mí."],["He abierto una de las cartas de Rosa. Solo una. Me ha llevado toda la tarde.","El valle huele distinto cuando no tienes prisa.","Tobías me deja barrer la forja. Dice que es un honor. Yo creo que es barrer."],["Si alguna vez tengo una granja, tendrá un rincón para los cardos. Por nostalgia.","Gracias por no dejarme ahí abajo. No sé si te lo había dicho.","Rosa tenía razón: la tierra recuerda a quien la cuida. Y a quien la fuerza."]],
 gus:[["El fuego no se aviva con prisa. Se aviva con paciencia y con carbón del bueno.","¿Tobías sigue tarareando mientras forja? Le enseñé yo. Mal, por lo visto.","Un arma común puede ser legendaria. Solo hay que ganárselo, golpe a golpe."],["Esa armadura te queda bien. Bueno, te queda. Es lo importante.","El cristal de grieta canta cuando lo calientas. Si un día lo oyes, me entenderás.","Tobías vino ayer. Hablamos. Bueno, gritamos. Luego hablamos."],["Eres lo más parecido a un aprendiz que he tenido en veinte años.","Cuando me muera, el yunque es para ti. Tobías se puede quedar las tenazas.","Mitológico. Esa palabra la reservo para muy pocas cosas. Tú vas camino."]],
 mavilah:[["Los libros de esta casa murmuran en sueños. No les hagas caso: exageran.","Los ecos de las criaturas se quedan en tus manos. Yo solo los ordeno.","Hace ochenta años, el valle me traía flores. Luego dejó de acordarse de mi nombre."],["Olmeda ha escrito tres capítulos esta semana. Dormida. Es una estudiante excelente.","Una rama del árbol sostiene a la otra. Como las personas.","Tu farol de lirio me recuerda a una primavera muy lejana."],["Gracias por acordarte de mí. Es el mejor hechizo que conozco.","Si vuelves mañana, pondré a calentar el caldero. Para la sopa, no para la magia.","Ya no me siento olvidada. Me siento... esperada."]],
 rengo:[["Los dragones no se doman. Se acompañan hasta que confían en ti.","Esta hoguera lleva encendida desde que se fue el último dragón adulto.","Cuidado con el borde. El viento de los riscos no avisa."],["Tu compañero me mira como miraba Brasa, mi primera dragona.","Los huevos que quedan laten más fuerte desde que limpias las grietas.","Nilo viene a verme cada semana. Trae galletas. Las quema todas."],["Si un día vuelven los dragones grandes, quiero que te vean a ti primero.","Has criado un dragón de verdad. Eso no lo hace cualquiera.","Ya no soy el último domador. Ahora somos dos."]],
 paloma:[["Mis pájaros conocen el valle mejor que el mapa de Darío. No se lo digas.","El grande se llama Albaricoque. No me preguntes por qué.","Si un pájaro te picotea la oreja, es que le caes bien."],["¡Albaricoque te ha guardado una pluma! Eso es casi un compromiso.","Desde que vuelves a casa sana y salva, mis pájaros vuelan más contentos.","Cuando era pequeña quería volar. Ahora lo hago, a medias."],["Eres mi pasajero favorito. No se lo digas a los demás.","He bautizado a un polluelo con tu nombre. Es muy ruidoso.","Vuela cuando quieras. Para ti, la parada nunca cierra."]],
});

 const L=SKILLS.filter(k=>k.b===skTab);

 h+='</div>';
 const cost=S.flags.mav9?0:200*plvl();h+=`<h3>Olvidar</h3><div class="card"><div class="body"><p class="sub">Mavilah puede hacerte olvidar todo lo aprendido para repartir los puntos de nuevo.</p>${cost?costHTML({},cost):''}</div><button class="btn alt sm" data-a="skreset" ${skSpent()&&S.gold>=cost?'':'disabled'}>Olvidar</button></div>`;

ACT.sktab=k=>{skTab=k;refreshAll();};

function xpKill(e){const ri=R.abyss?5+Math.floor(R.floor/10):Math.max(0,REGIONS.findIndex(r=>r.id===R.region)),D=EN[e.type]||{hp:40};
 const m=1+ri*.6;return Math.round((e.boss?120:(5+D.hp/6)*(e.elite?3:1))*m*xpMul());}
function grantXp(n){const before=plvl();S.xp=(S.xp||0)+n;const after=plvl();return after-before;}

function runTick(dt){const p=R.p,st=R.st;if(R.dying||R.ended)return;
 if(st.regen&&p.hp<p.maxHp)p.hp=Math.min(p.maxHp,p.hp+p.maxHp*st.regen*dt);
 if(st.shieldCd){if(R.shield==null)R.shield=1;if(!R.shield){R.shieldT=(R.shieldT||0)+dt;if(R.shieldT>=st.shieldCd){R.shield=1;R.shieldT=0;}}}
 if(st.storm&&!R.cleared){R.stormT=(R.stormT||0)+dt;if(R.stormT>=st.storm){R.stormT=0;for(let i=0;i<12;i++){const a=i/12*6.283;R.ps.push({x:p.x,y:p.y-12,vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:4,dm:.6,kind:'arrow',col:'#8fe060',pierce:1,bounce:0,wall:0,hit:new Set(),life:1.1,t:0,ret:false,spd:300});}snd('shot',.8,.8);}}
 runPetTick(dt);}
function runHurtMod(d){const st=R.st,p=R.p;if(st.shieldCd&&R.shield){R.shield=0;R.shieldT=0;p.inv=.6;snd('dig',.8,1.4);FT.push({x:p.x,y:p.y-40,t:'¡Bloqueado!',c:'#8fe060',life:.8,vy:-26});for(let i=0;i<10;i++)R.fx.push({x:p.x,y:p.y-10,vx:rnd(-90,90),vy:rnd(-90,90),life:.4,c:'#8fe060',s:3});return 0;}
 d*=1-(st.def||0);
 if(st.thorns){for(const e of R.en)if(!e.dead&&!e.inv&&dist(e.x,e.y,p.x,p.y)<90)damage(e,d*st.thorns,false);}
 return d;}
function runAfterHurt(){const st=R.st,p=R.p;if(st.lastRoot&&p.hp>0&&p.hp<p.maxHp*.25&&R.lastRootUsed!==R.room){R.lastRootUsed=R.room;p.inv=3;FT.push({x:p.x,y:p.y-50,t:'Última raíz',c:'#8fe060',life:1.4,vy:-18,big:1});snd('heal');}}
function runLastStand(){const st=R.st,p=R.p;if(st.fenix&&!R.fenixUsed){R.fenixUsed=1;p.hp=p.maxHp*st.fenix;p.inv=1.6;R.eb=[];FT.push({x:p.x,y:p.y-50,t:'¡El fénix te levanta!',c:'#ff9a4a',life:1.6,vy:-18,big:1});snd('powerup');return true;}return false;}
function runOnHit(e){const st=R.st;if(e.dead)return;if(st.burnCh&&Math.random()<st.burnCh)e.burn={dps:st.dmg*.25,t:2.5};if(st.frzCh&&!e.boss&&Math.random()<st.frzCh)e.frozen=Math.max(e.frozen||0,.5);}
function runOnKill(e){const x=xpKill(e);R.xp=(R.xp||0)+x;if(S.flags.metMav&&!e.boss&&Math.random()<.25)FT.push({x:e.x+8,y:e.y-26,t:`+${x} exp`,c:'#c99aff',life:.6,vy:-30});
 if(e.byPet&&typeof petQuestEvent==='function')petQuestEvent('petkill');
 if(e.boss)rareBossDrops(e);}
/* rarity materials: crystal from the late story rifts and leveled replays, amber higher up, astral dust only in the Abyss */
function rareBossDrops(e){const it=R.loot.items,add=(k,n)=>{if(n<=0)return;it[k]=(it[k]||0)+n;FT.push({x:e.x,y:e.y-70-Object.keys(it).length*4,t:`+${n} ${ITEMS[k].n}`,c:ITEMS[k].c,life:2.2,vy:-10,big:1});};
 if(R.abyss){add('cristal',2);if(R.floor>=20)add('ambar',1+(R.floor>=40?1:0));if(R.floor>=20)add('astral',1+(R.floor>=40?1:0));return;}
 if(R.evo){add('cristal',2);return;}
 const ri=REGIONS.findIndex(r=>r.id===R.region),L=R.lvl||0;
 if(R.storyBoss){if(ri>=3)add('cristal',2);if(ri>=4)add('ambar',1);return;}
 if(L>=3)add('cristal',Math.ceil((L-2)/2)+(ri>=3?1:0));if(L>=6)add('ambar',1+(L>=9?1:0)+(ri>=4?1:0));}

/* ---- where the relics hide: two of each, off the beaten path ---- */
const HIDDEN={

 susurro:{'3,12':'rocio','14,33':'rocio'},        /* down the two wrong paths, right before the whispers */
 riscos:{'22,20':'escamab','23,3':'escamab'}};    /* far corner past bridge II · far corner of Rengo's camp */
const HIDTXT={ascua:'Entre las piedras brilla una brasa que no quema. Late despacio, como un corazón pequeño.',rocio:'Sobre una hoja tiembla una gota de luz. No cae. Parece que te estaba esperando.',escamab:'Medio enterrada en la roca asoma una escama enorme, roja y dorada. Todavía está tibia.'};
const HIDC={ascua:['#ff6b3a','#ffb347','#fff3c4'],rocio:['#bff6ff','#ffffff','#9fd8f0'],escamab:['#ffd27a','#f38c4c','#fff3c4']};
const KEYREQ={llave:1,ascua:2,rocio:2,escamab:2,hierro:8};
const hidS=id=>{const s=areaS(id);if(!s.hd)s.hd={};return s.hd;};

const keyNeeded=()=>!!S&&S.ch>=10&&!S.bossDone.cardo&&!inv('llavec');
const finalReady=()=>!!inv('llavec')&&petLv()>=5;
function takeHidden(id,key){const k=HIDDEN[id][key],s=hidS(id);if(s[key])return;s[key]=1;addI(k);const[x,y]=key.split(',').map(Number);
 jing('secret');for(let i=0;i<18;i++)FP.push({x:(x+.5)*TS,y:(y+.3)*TS,vx:rnd(-60,60),vy:rnd(-150,-50),life:rnd(.5,1),c:pick(HIDC[k])});
 const[n,t]=relicOf(k);say([{who:'narr',t:HIDTXT[k]},{who:'narr',t:`Consigues: ${ITEMS[k].n} (${n}/${t}).${n<t?' Quizá haya otra escondida por aquí.':''}${keyNeeded()?'':' Seguro que Gus sabe qué hacer con esto.'}`}],()=>{refreshAll();save();});}
{const o=areaSpots;areaSpots=function(L){o(L);const M=WORLD[P.map];if(!M||M.interior||!HIDDEN[M.id])return;const H=HIDDEN[M.id],s=hidS(M.id);

  L.push({x:X,y:Y+4,r:26,label:'Recoger',sub:'algo brilla',ic:H[key],fn:()=>takeHidden(M.id,key)});}};}

function drawGlint(x,y,k,al){const C=HIDC[k],tw=.5+.5*Math.sin(T*4+x),r=1+Math.round(tw*2);bx.globalAlpha=al*(.35+.3*tw);pxDisk(x,y,4,C[0]);bx.globalAlpha=al;

{const o=drawAreaCast;drawAreaCast=function(M,add,vis){o(M,add,vis);const H=HIDDEN[M.id];if(!H||M.interior)return;const s=hidS(M.id);

  const al=Math.min(1,(3.6*TS-d)/(1.4*TS));add(Y-3,()=>drawGlint(P2(X),P2(Y)+1,H[key],al));}};}

/* ---- Gus reforges the key ---- */
function keyCard(){const hint={ascua:'en el desfiladero: junto a la lava, detrás de mi forja, y tras una roca agrietada cerca de la entrada',rocio:'en el bosque: al final de los caminos que no debes tomar, justo antes de los susurros',escamab:'en los riscos: en el rincón más alejado del campamento de Rengo, y al otro lado del puente II'};
 const rows=['ascua','rocio','escamab'].map(k=>{const[n,t]=relicOf(k);return `<p class="sub irow"><b>${ITEMS[k].n} ${Math.min(inv(k),2)}/2:</b> ${n>=t&&inv(k)>=2?'¡ya las tienes!':hint[k]+'.'}</p>`;}).join('');
 return `<h3>Encargo especial</h3><div class="card"><span class="wic">${ic('llavec','l')}</span><div class="body"><div class="name">Llave del Corazón</div><p class="sub">«La llave de Rosa sola no abre esa puerta. Tráeme dos de cada reliquia y te la reforjo. Brillan poco: tendrás que acercarte. Tu bicho tiene buen olfato.»</p>${rows}${costHTML(KEYREQ)}</div><button class="btn pri sm" data-a="forgekey" ${canPay(KEYREQ)?'':'disabled'}>Forjar</button></div>`;}
{const o=sheetGus;sheetGus=function(){const h=o();if(!keyNeeded())return h;const i=h.indexOf('<div class="tabs">');return i<0?h+keyCard():h.slice(0,i)+keyCard()+h.slice(i);};}
ACT.forgekey=()=>{if(!keyNeeded()||!canPay(KEYREQ))return;take(KEYREQ);addI('llavec');closeSheet();snd('hit');shake=6;setTimeout(()=>{snd('hit');shake=6;},320);setTimeout(()=>{snd('boom',.6,1.2);shake=9;jing('secret');},640);
 setTimeout(()=>say([{who:'gus',t:'Una ascua que no se apaga, rocío que no cae y la escama de una dragona. Y la llave de Rosa como alma. ¡Al yunque!'},{who:'narr',t:'Gus golpea tres veces. A la tercera, la llave late como un corazón.'},
  {who:'gus',t:'Ahí la tienes: la Llave del Corazón. Abrirá lo que haya bajo la cumbre.'},{who:'gus',t:'Y si ese Cardo se pone tonto, dale un abrazo de mi parte. Con el martillo.'},{who:'narr',t:'Has conseguido la Llave del Corazón.'}],()=>{refreshAll();save();}),900);refreshAll();save();};

function finalNeeds(){const L=[];if(!inv('llavec')){const r=['ascua','rocio','escamab'].map(k=>`${ITEMS[k].n.toLowerCase()} ${Math.min(inv(k),2)}/2`).join(', ');L.push(`forja la Llave del Corazón con Gus (${r})`);}
 if(petLv()<5)L.push(S.pet?`entrena a ${S.pet.name} con Rengo hasta que sea un Dragón (etapa ${petLv()}/5)`:'adopta un compañero y entrénalo con Rengo hasta que sea un Dragón');return L;}
{const o=objective;objective=function(){const r=o();if(S.ch===10&&S.stage==='rift'&&!S.bossDone.cardo&&!finalReady())return{t:r.t,d:'Antes de bajar al Corazón: '+finalNeeds().join(' y ')+'.'};return r;};}
{const o=ACT.run;ACT.run=id=>{if(id==='raiz'&&!S.bossDone.cardo&&!finalReady()){closeSheet();const L=[{who:'narr',t:'Al fondo de la grieta, la puerta del Corazón está sellada con espinas negras que laten.'}];
  if(!inv('llavec'))L.push({who:'narr',t:'La llave de raíz entra en la cerradura, pero no gira. Gus sabrá reforjarla.'});
  if(petLv()<5)L.push({who:'narr',t:S.pet?`${S.pet.name} gime y se esconde detrás de ti. Todavía no está preparado: Rengo puede ayudarte a entrenarle.`:'Algo te dice que ahí abajo vas a necesitar un compañero. Uno con alas.'});
  say(L);return;}o(id);};}
{const o=sheetGrieta;sheetGrieta=function(){let h=o();if(S.bossDone.cardo||finalReady())return h;
 const ok=(b,t)=>`<span style="color:${b?'#8fe060':'#ff8a7a'}">${b?'✔':'✘'} ${t}</span>`,req=`<p class="sub">${ok(!!inv('llavec'),'Llave del Corazón')} · ${ok(petLv()>=5,S.pet?`${esc(S.pet.name)} en etapa Dragón`:'Un compañero dragón')}</p>`;

 else{toast(`Hola de nuevo, ${S.name}. Día ${dayIn()} de ${SEASONS[season()].toLowerCase()}.`);if(S.flags.storyNews){delete S.flags.storyNews;save();setTimeout(()=>say([{who:'narr',t:'El valle ha cambiado desde tu última visita: hay caminos nuevos, gente nueva... y alguien rondando tu granja de noche.'},...CH[3].intro()],()=>{refreshAll();save();}),900);}
  if(S.flags.news5){delete S.flags.news5;save();setTimeout(()=>say([{who:'narr',t:'La historia del valle ha cambiado un poco: Nilo ha desaparecido en los Riscos del Dragón, al norte de tu granja. Darío te ha dado su garfio.'},{who:'narr',t:'El jardín de Cardo tendrá que esperar.'}],()=>{refreshAll();save();}),1100);}
  if(S.flags.voBack){delete S.flags.voBack;save();setTimeout(()=>toast('Aspersores, espantapájaros y gólems ahora van en las esquinas entre casillas. Los tuyos están en la mochila para recolocarlos.',5200),2800);}}}
